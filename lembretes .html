<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlicoGabi - Lembretes Premium</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7e57ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --primaria: #7e57ff;
            --lavanda-claro: #f4f0ff;
            --lavanda-medio: #e3d9ff;
            --texto: #333;
        }

        body { font-family: 'Segoe UI', sans-serif; background: #f0f0f0; margin: 0; display: flex; justify-content: center; padding: 15px; }
        
        .outer-frame {
            border: 8px solid var(--primaria); border-radius: 35px; background: var(--primaria);
            width: 100%; max-width: 400px; height: 92vh; display: flex; flex-direction: column;
        }

        .container {
            background: white; flex: 1; border-radius: 25px; margin: 5px;
            overflow-y: auto; display: flex; flex-direction: column;
        }

        .header { background: var(--primaria); color: white; text-align: center; padding: 15px; }
        
        .tabs { display: flex; background: var(--lavanda-claro); margin: 10px 15px; border-radius: 12px; padding: 5px; gap: 5px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; font-weight: bold; color: var(--primaria); cursor: pointer; border-radius: 8px; font-size: 11px; }
        .tab-btn.active { background: white; box-shadow: 0 2px 5px rgba(0,0,0,.1); }

        .section-box { background: var(--lavanda-claro); margin: 0 15px 15px; padding: 15px; border-radius: 20px; border: 1px solid var(--lavanda-medio); }

        input { padding: 12px; border-radius: 10px; border: 1px solid #ddd; font-size: 14px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        
        .btn-acao { background: var(--primaria); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 8px; }

        .dias-selecao { display: flex; justify-content: space-between; margin: 10px 0; gap: 2px; }
        .dia-item { flex: 1; text-align: center; }
        .dia-item input { display: none; }
        .dia-item label { 
            display: block; padding: 8px 2px; background: white; border: 1px solid var(--lavanda-medio); 
            border-radius: 8px; font-size: 10px; cursor: pointer; color: var(--primaria); font-weight: bold;
        }
        .dia-item input:checked + label { background: var(--primaria); color: white; }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; }
        th { background: var(--primaria); color: white; padding: 10px; font-size: 12px; text-align: left; }
        td { padding: 12px 10px; border-bottom: 1px solid #eee; font-size: 13px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="outer-frame">
    <div class="container">
        <div class="header"><h3>Lembretes GlicoGabi</h3></div>

        <div class="tabs">
            <button id="btnLembretes" class="tab-btn active" onclick="toggleAba('lembretes')">Lembretes Atuais</button>
            <button id="btnConfigLembrete" class="tab-btn" onclick="toggleAba('config-lembrete')">Configurar</button>
        </div>

        <div id="abaConfigLembrete" class="hidden">
            <label style="font-size:10px; font-weight:bold; color:var(--primaria); margin-left:20px">DADOS DE ENVIO</label>
            <div class="section-box" style="margin-top:5px">
                <input type="text" id="telUsuario" placeholder="Seu WhatsApp (Ex: 11999999999)">
            </div>

            <label style="font-size:10px; font-weight:bold; color:var(--primaria); margin-left:20px">NOVO ALERTA RECORRENTE</label>
            <div class="section-box" style="margin-top:5px">
                <input type="text" id="titLembrete" placeholder="Descrição (Ex: Tomar Insulina)">
                <input type="time" id="horaLembrete">
                
                <label style="font-size:10px; font-weight:bold; color:var(--primaria);">REPETIR NOS DIAS:</label>
                <div class="dias-selecao">
                    <div class="dia-item"><input type="checkbox" id="d0" value="0"><label for="d0">DOM</label></div>
                    <div class="dia-item"><input type="checkbox" id="d1" value="1" checked><label for="d1">SEG</label></div>
                    <div class="dia-item"><input type="checkbox" id="d2" value="2" checked><label for="d2">TER</label></div>
                    <div class="dia-item"><input type="checkbox" id="d3" value="3" checked><label for="d3">QUA</label></div>
                    <div class="dia-item"><input type="checkbox" id="d4" value="4" checked><label for="d4">QUI</label></div>
                    <div class="dia-item"><input type="checkbox" id="d5" value="5" checked><label for="d5">SEX</label></div>
                    <div class="dia-item"><input type="checkbox" id="d6" value="6"><label for="d6">SAB</label></div>
                </div>

                <button class="btn-acao" onclick="salvarLembrete()">Salvar Despertador</button>
            </div>
        </div>

        <div id="abaLembretes">
            <label style="font-size:10px; font-weight:bold; color:var(--primaria); margin-left:20px">MEUS ALERTAS ATIVOS</label>
            <div class="section-box" style="margin-top:5px; padding:5px">
                <table>
                    <thead>
                        <tr><th>Hora</th><th>Lembrete / Dias</th><th>Ações</th></tr>
                    </thead>
                    <tbody id="listaLembretes"></tbody>
                </table>
            </div>
            <p style="font-size: 10px; color: #888; text-align: center; padding: 10px;">
                Para funcionar com a tela bloqueada, adicione este app à sua Tela de Início.
            </p>
        </div>
    </div>
</div>

<script>
    let lembretes = JSON.parse(localStorage.getItem('gabi_lembretes_vFinal')) || [];
    const nomesDias = ["DOM", "SEG", "TER", "QUA", "QUI", "SEX", "SAB"];

    // 1. Registro do Service Worker para notificações em segundo plano
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
        .then(() => console.log("SW Registrado!"))
        .catch(err => console.log("Erro SW:", err));
    }

    // Solicitar permissão de notificação
    window.addEventListener('load', () => {
        if ("Notification" in window) {
            Notification.requestPermission();
        }
        document.getElementById('telUsuario').value = localStorage.getItem('gabi_tel') || "";
    });

    function toggleAba(aba) {
        document.getElementById('abaLembretes').classList.toggle('hidden', aba !== 'lembretes');
        document.getElementById('abaConfigLembrete').classList.toggle('hidden', aba !== 'config-lembrete');
        document.getElementById('btnLembretes').classList.toggle('active', aba === 'lembretes');
        document.getElementById('btnConfigLembrete').classList.toggle('active', aba === 'config-lembrete');
        if(aba === 'lembretes') renderLembretes();
    }

    function salvarLembrete() {
        const titulo = document.getElementById('titLembrete').value;
        const hora = document.getElementById('horaLembrete').value;
        const tel = document.getElementById('telUsuario').value;
        
        let dias = [];
        for(let i=0; i<7; i++) if(document.getElementById('d' + i).checked) dias.push(i);

        if(!titulo || !hora || dias.length === 0) return alert("Preencha todos os campos!");

        lembretes.push({ titulo, hora, dias, ultimoDisparo: "" });
        lembretes.sort((a, b) => a.hora.localeCompare(b.hora));
        
        localStorage.setItem('gabi_lembretes_vFinal', JSON.stringify(lembretes));
        localStorage.setItem('gabi_tel', tel);
        
        document.getElementById('titLembrete').value = "";
        alert("Despertador Configurado!");
        toggleAba('lembretes');
    }

    function renderLembretes() {
        const lista = document.getElementById('listaLembretes');
        if (lembretes.length === 0) {
            lista.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#999; padding:20px;">Nenhum alerta ativo</td></tr>`;
            return;
        }

        lista.innerHTML = lembretes.map((l, i) => {
            let textoDias = l.dias.length === 7 ? "Todos os dias" : l.dias.map(d => nomesDias[d]).join(', ');
            return `
                <tr>
                    <td style="color:var(--primaria); font-weight:bold; font-size:15px">${l.hora}</td>
                    <td>
                        <span style="font-weight:bold">${l.titulo}</span><br>
                        <small style="color:#888; font-size:9px">${textoDias}</small>
                    </td>
                    <td><button onclick="remover(${i})" style="border:none; background:none; cursor:pointer">❌</button></td>
                </tr>
            `;
        }).join('');
    }

    function remover(i) {
        if(confirm("Excluir alerta?")) {
            lembretes.splice(i, 1);
            localStorage.setItem('gabi_lembretes_vFinal', JSON.stringify(lembretes));
            renderLembretes();
        }
    }

    // MONITOR DE HORÁRIO (Roda a cada 10 segundos)
    setInterval(() => {
        const agora = new Date();
        const diaHoje = agora.getDay();
        const horaMin = agora.getHours().toString().padStart(2, '0') + ":" + agora.getMinutes().toString().padStart(2, '0');
        const chaveMinuto = agora.toDateString() + horaMin;

        lembretes.forEach(l => {
            if(l.hora === horaMin && l.dias.includes(diaHoje) && l.ultimoDisparo !== chaveMinuto) {
                l.ultimoDisparo = chaveMinuto;
                localStorage.setItem('gabi_lembretes_vFinal', JSON.stringify(lembretes));

                // Dispara Notificação via Service Worker
                if (navigator.serviceWorker.controller) {
                    navigator.serviceWorker.controller.postMessage({
                        type: 'ALERTA_GLICEMIA',
                        message: 'HORA DE: ' + l.titulo
                    });
                }

                // Som de Alerta
                const audio = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
                audio.play().catch(() => {});
            }
        });
    }, 10000);

    renderLembretes();
</script>
</body>
</html>
