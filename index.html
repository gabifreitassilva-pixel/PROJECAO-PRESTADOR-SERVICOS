<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlicoGabi Oficial</title>
    <style>
        :root { --primaria: #7e57ff; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f0f0; margin: 0; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        
        .celular {
            width: 100%; max-width: 400px; height: 95vh; background: var(--primaria);
            border: 8px solid var(--primaria); border-radius: 35px; display: flex; flex-direction: column; margin-top: 10px;
        }

        .menu-superior {
            display: flex; overflow-x: auto; padding: 10px; gap: 8px; scrollbar-width: none;
        }
        .menu-superior::-webkit-scrollbar { display: none; }

        .btn-aba {
            background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 15px;
            border-radius: 20px; white-space: nowrap; font-weight: bold; cursor: pointer;
        }
        .btn-aba.ativo { background: white; color: var(--primaria); }

        iframe {
            flex: 1; border: none; border-radius: 25px 25px 0 0; background: white;
        }
    </style>
</head>
<body>
    <div class="celular">
        <div class="menu-superior">
            <button class="btn-aba ativo" onclick="mudarAba('home.html', this)">🏠 Home</button>
            <button class="btn-aba" onclick="mudarAba('consulta e exames.HTML', this)">🩺 Consultas</button>
            <button class="btn-aba" onclick="mudarAba('historico.HTML', this)">📅 Linha do Tempo</button>
            <button class="btn-aba" onclick="mudarAba('ESTOQUE.HTML', this)">📦 Estoque</button>
            <button class="btn-aba" onclick="mudarAba('ajuste.html', this)">⚙️ Ajustes</button>
            <button class="btn-aba" onclick="mudarAba('lembretes .html', this)">🔔 Lembretes</button>
        </div>
        <iframe id="conteudo-app" src="home.html"></iframe>
    </div>

    <script>
        function mudarAba(url, btn) {
            document.getElementById('conteudo-app').src = url;
            document.querySelectorAll('.btn-aba').forEach(b => b.classList.remove('ativo'));
            btn.classList.add('ativo');
        }
    </script>
</body>
</html>
