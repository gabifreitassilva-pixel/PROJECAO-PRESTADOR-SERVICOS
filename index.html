<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GlicoGabi</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7e57ff">
    <style>
        :root { --primaria: #7e57ff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background-color: var(--primaria); /* Roxo até o final */
            display: flex; justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .outer-frame {
            background-color: var(--primaria);
            width: 100%; max-width: 450px; height: 100vh;
            display: flex; flex-direction: column;
        }

        .content-container {
            flex: 1; 
            background: white; 
            border-radius: 0 0 25px 25px; 
            overflow: hidden; 
        }

        iframe { width: 100%; height: 100%; border: none; }

        /* MENU DE NAVEGAÇÃO INFERIOR ESTILO APP */
        .nav-tabs {
            display: flex; 
            justify-content: space-between; /* Distribui os 6 botões igualmente */
            align-items: center;
            background: var(--primaria);
            padding: 8px 5px 12px 5px; /* Espaço para o nome não cortar embaixo */
            height: 75px;
        }

        .tab-btn {
            background: none; 
            border: none; 
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column; /* Ícone em cima, texto embaixo */
            align-items: center;
            justify-content: center;
            flex: 1; 
            min-width: 0;
            opacity: 0.6;
            transition: 0.2s;
            text-decoration: none;
        }

        /* Ajuste do Ícone */
        .tab-btn i {
            font-size: 20px; 
            margin-bottom: 4px;
            font-style: normal;
        }

        /* Ajuste do Texto */
        .tab-btn span {
            font-size: 8.5px; /* Tamanho calculado para caber os 6 nomes */
            font-weight: 600;
            white-space: nowrap;
            text-transform: none;
        }

        .tab-btn.active { 
            opacity: 1;
        }

        /* Indicador visual para a aba ativa */
        .tab-btn.active i {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="outer-frame">
        <div class="content-container">
            <iframe id="janela" src="home.html"></iframe>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="navegar('home.html', this)">
                <i>🏠</i><span>Home</span>
            </button>
            <button class="tab-btn" onclick="navegar('consulta e exames.HTML', this)">
                <i>🩺</i><span>Consultas</span>
            </button>
            <button class="tab-btn" onclick="navegar('historico.HTML', this)">
                <i>📅</i><span>Histórico</span>
            </button>
            <button class="tab-btn" onclick="navegar('ESTOQUE.HTML', this)">
                <i>📦</i><span>Estoque</span>
            </button>
            <button class="tab-btn" onclick="navegar('ajuste.html', this)">
                <i>⚙️</i><span>Ajustes</span>
            </button>
            <button class="tab-btn" onclick="navegar('lembretes .html', this)">
                <i>🔔</i><span>Lembretes</span>
            </button>
        </div>
    </div>

    <script>
        function navegar(url, btn) {
            document.getElementById('janela').src = url;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
