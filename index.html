<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GlicoGabi</title>
    
    <link rel="manifest" href="MANIFEST.JSON">
    <meta name="theme-color" content="#7e57ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="ÍCONE.PNG">

    <style>
        :root { --primaria: #7e57ff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            background-color: white; 
            display: flex; flex-direction: column; 
            font-family: 'Segoe UI', sans-serif; overflow: hidden; 
        }

        /* Tela de Carregamento (Splash Screen) */
        #splash {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--primaria);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10000; transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
            text-align: center;
        }
        #splash img { 
            width: 180px; 
            height: 180px; 
            border-radius: 20%;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .splash-text { color: white; text-transform: uppercase; }
        .splash-text h1 { margin: 0; font-size: 24px; font-weight: bold; }
        .splash-text h2 { margin: 5px 0 0; font-size: 20px; opacity: 0.9; }

        /* Contentor do Iframe */
        .content-container { flex: 1; background: white; width: 100%; position: relative; }
        iframe { width: 100%; height: 100%; border: none; display: block; }

        /* Barra de Navegação Inferior */
        .nav-tabs { 
            display: flex; width: 100%; background: white; 
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); 
            justify-content: space-around; align-items: center; 
            height: 75px;
            border-top: 1px solid #eee;
        }
        .tab-btn { 
            background: none; border: none; color: #888; cursor: pointer; 
            display: flex; flex-direction: column; align-items: center; 
            flex: 1; transition: 0.2s; min-width: 50px;
        }
        .tab-btn i { font-size: 22px; margin-bottom: 4px; font-style: normal; }
        .tab-btn span { font-size: 9px; font-weight: bold; text-transform: uppercase; }
        
        /* Aba Ativa */
        .tab-btn.active { color: var(--primaria); transform: scale(1.1); }
    </style>
</head>
<body>

    <div id="splash">
        <img src="ÍCONE.PNG" alt="GlicoGabi Logo">
        <div class="splash-text">
            <h1>GlicoGabi</h1>
            <h2>Controle de Glicose</h2>
        </div>
    </div>

    <div class="content-container">
        <iframe id="janela" src="HOME.HTML"></iframe>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="navegar('HOME.HTML', this)"><i>🏠</i><span>Home</span></button>
        <button class="tab-btn" onclick="navegar('CONSULTAS E EXAMES.html', this)"><i>🩺</i><span>Consultas</span></button>
        <button class="tab-btn" onclick="navegar('HISTÓRICO.html', this)"><i>📅</i><span>Histórico</span></button>
        <button class="tab-btn" onclick="navegar('ESTOQUE.html', this)"><i>📦</i><span>Estoque</span></button>
        <button class="tab-btn" onclick="navegar('AJUSTE.html', this)"><i>⚙️</i><span>Ajustes</span></button>
        <button class="tab-btn" onclick="navegar('LEMBRETES.HTML', this)"><i>🔔</i><span>Alertas</span></button>
    </div>

    <script>
        // Esconder o splash screen após 2.5 segundos
        window.addEventListener('load', () => {
            setTimeout(() => { 
                const splash = document.getElementById('splash');
                splash.style.transform = 'translateY(-100%)'; 
            }, 2500);
        });

        // Função para mudar de aba
        function navegar(url, btn) {
            const janela = document.getElementById('janela');
            
            // Atualiza o src do iframe
            janela.src = url;

            // Atualiza o estado visual dos botões
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // Registo do Service Worker para funcionar offline
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('SW.JS').catch(err => console.log("Erro SW:", err));
        }
    </script>
</body>
</html>
