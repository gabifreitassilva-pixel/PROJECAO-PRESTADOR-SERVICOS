<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GlicoGabi</title>
    
    <link rel="manifest" href="MANIFEST.JSON">
    <link rel="apple-touch-icon" href="ÍCONE.PNG">
    <meta name="theme-color" content="#7e57ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root { --primaria: #7e57ff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            background-color: var(--primaria); 
            font-family: 'Segoe UI', sans-serif; overflow: hidden; 
        }

        /* TELA DE ABERTURA (SPLASH) */
        #splash {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--primaria);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10000; transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
            text-align: center;
        }

        #splash img { 
            width: 100%; height: 100%; object-fit: cover; 
            position: absolute; top: 0; left: 0; z-index: -1; 
        }

        /* TEXTO PERSONALIZADO NA ABERTURA */
        .splash-text { 
            color: white; 
            z-index: 10; 
            margin-top: 320px; 
            text-transform: uppercase;
        }
        .splash-text h1 { margin: 0; font-size: 24px; font-weight: bold; letter-spacing: 1px; }
        .splash-text h2 { margin: 5px 0 0; font-size: 24px; font-weight: bold; letter-spacing: 1px; }

        /* INTERFACE PRINCIPAL */
        .content-container { flex: 1; background: white; border-radius: 0 0 25px 25px; overflow: hidden; width: 100%; height: calc(100% - 75px); }
        iframe { width: 100%; height: 100%; border: none; }

        .nav-tabs { 
            display: flex; width: 100%; background: var(--primaria); 
            padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); 
            justify-content: space-around; align-items: center; height: 75px;
        }

        .tab-btn { background: none; border: none; color: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; flex: 1; opacity: 0.5; transition: 0.3s; }
        .tab-btn i { font-size: 22px; margin-bottom: 3px; font-style: normal; }
        .tab-btn span { font-size: 9px; font-weight: bold; text-transform: uppercase; }
        .tab-btn.active { opacity: 1; transform: scale(1.1); }
    </style>
</head>
<body>

    <div id="splash">
        <img src="ÍCONE.PNG" alt="Fundo">
        <div class="splash-text">
            <h1>Controle de Glicose</h1>
            <h2>Gabi</h2>
        </div>
    </div>

    <div class="content-container">
        <iframe id="janela" src="HOME.HTML"></iframe>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="navegar('HOME.HTML', this)"><i>🏠</i><span>Home</span></button>
        <button class="tab-btn" onclick="navegar('CONSULTA E EXAMES.HTML', this)"><i>🩺</i><span>Consultas</span></button>
        <button class="tab-btn" onclick="navegar('HISTÓRICO.HTML', this)"><i>📅</i><span>Histórico</span></button>
        <button class="tab-btn" onclick="navegar('ESTOQUES.HTML', this)"><i>📦</i><span>Estoque</span></button>
        <button class="tab-btn" onclick="navegar('AJUSTES.HTML', this)"><i>⚙️</i><span>Ajustes</span></button>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('splash').style.transform = 'translateY(-100%)';
            }, 2500);
        });

        function navegar(url, btn) {
            document.getElementById('janela').src = url;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('SW.JS');
        }
    </script>
</body>
</html>
