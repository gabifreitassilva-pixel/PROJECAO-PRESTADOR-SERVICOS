<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARADEL ASSESSORIA - Inteligência em Retenções</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        .slide-in { animation: slideIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
        .hidden-el { display: none !important; }
        .glass { background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(15px); }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }
        html, body { background-color: #050505; color: #ffffff; }
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
        }
    </style>
</head>
<body class="font-sans selection:bg-orange-500/30 p-2 md:p-4 flex flex-col min-h-screen text-white custom-scroll">

    <header class="max-w-7xl mx-auto w-full mb-6 flex items-center justify-between border-b border-gray-800 pb-4 shrink-0 mt-2 no-print">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-br from-orange-500 to-orange-700 p-2 rounded-xl shadow-lg shadow-orange-900/20">
                <i data-lucide="shield-check" class="text-[#050505] w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white tracking-tight leading-none uppercase">MARADEL ASSESSORIA</h1>
                <p class="text-[9px] text-white font-bold uppercase tracking-[0.2em] mt-1 opacity-80">Conferência Fiscal & De/Para Municipal</p>
            </div>
        </div>
        <div id="statusNuvem" class="flex items-center gap-2 text-[9px] font-bold bg-gray-900 px-3 py-1 rounded-full border border-gray-800 text-white">
            <div id="statusDot" class="w-1.5 h-1.5 bg-yellow-500 rounded-full animate-pulse"></div>
            <span id="statusText">SINCRONIZANDO GIST...</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-6 pb-12">
        <div class="lg:col-span-5 flex flex-col gap-6 no-print">
            <div class="bg-[#111111] rounded-2xl p-5 border border-gray-800 shadow-xl">
                <h2 class="text-[11px] font-bold text-orange-500 uppercase tracking-widest flex items-center gap-2 mb-4 border-b border-gray-800/50 pb-2">
                    <i data-lucide="building" class="w-3.5 h-3.5"></i> 1. Identificação
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-bold text-white mb-1.5 uppercase">CNPJ do Prestador</label>
                        <div class="flex gap-2">
                            <input type="text" id="cnpjPrestador" class="flex-1 bg-[#080808] border border-gray-700 rounded-lg px-3 py-3 text-sm text-white focus:border-orange-500 outline-none transition-all font-mono" placeholder="00.000.000/0000-00">
                            <button id="btnBuscarCnpj" class="bg-orange-600 hover:bg-orange-500 text-white px-4 rounded-lg font-bold transition-all flex items-center justify-center min-w-[48px]">
                                <i data-lucide="search" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                    <div id="razaoSocialContainer" class="hidden-el p-3 bg-[#181818] rounded-xl border border-gray-800 flex flex-col gap-1.5 animate-in fade-in">
                        <span id="razaoSocialNome" class="text-xs font-bold text-white uppercase truncate"></span>
                        <div class="flex flex-wrap items-center gap-2">
                            <span id="razaoSocialRegime" class="text-[8px] font-black uppercase px-1.5 py-0.5 rounded border"></span>
                            <span id="razaoSocialMunicipio" class="text-[8px] font-bold uppercase text-gray-100"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-[#111111] rounded-2xl p-5 border border-gray-800 shadow-xl">
                <h2 class="text-[11px] font-bold text-orange-500 uppercase tracking-widest flex items-center gap-2 mb-4 border-b border-gray-800/50 pb-2">
                    <i data-lucide="file-text" class="w-3.5 h-3.5"></i> 2. Detalhes da Nota
                </h2>
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-white mb-1.5 uppercase font-mono">Cód. Municipal</label>
                            <input type="text" id="codMunicipal" class="w-full bg-[#080808] border border-orange-500/40 rounded-lg px-3 py-3 text-sm text-white focus:border-orange-500 outline-none font-mono" placeholder="Digite para Converter">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-white mb-1.5 uppercase">Valor Bruto (R$)</label>
                            <input type="text" id="valorTotal" class="w-full bg-[#080808] border border-gray-700 rounded-lg px-3 py-3 text-sm text-green-400 font-bold focus:border-orange-500 outline-none font-mono" placeholder="0,00">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-white mb-1.5 uppercase">Código Federal (LC 116/03)</label>
                        <select id="codigoServico" class="w-full bg-[#080808] border border-gray-700 rounded-lg px-3 py-3 text-xs text-white focus:border-orange-500 outline-none appearance-none cursor-pointer">
                            <option value="" disabled selected>Aguardando preenchimento...</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div id="containerAliqISS">
                            <label class="block text-[10px] font-bold text-green-500 mb-1.5 uppercase font-mono">Aliq. ISS (%)</label>
                            <input type="text" id="aliqISS" value="5.00" class="w-full bg-[#080808] border border-green-500/30 rounded-lg px-3 py-3 text-sm text-white outline-none font-bold">
                        </div>
                        <div id="containerDeducao">
                            <label class="block text-[10px] font-bold text-yellow-500 mb-1.5 uppercase">Dedução (R$)</label>
                            <input type="text" id="valorMaterial" class="w-full bg-[#080808] border border-yellow-500/20 rounded-lg px-3 py-3 text-sm text-white outline-none font-mono font-bold" placeholder="0,00">
                        </div>
                    </div>
                    <button id="btnExecutarAuditoria" class="w-full mt-4 bg-orange-600 hover:bg-orange-500 text-[#050505] font-black py-4 rounded-xl uppercase tracking-widest text-xs flex items-center justify-center gap-2">
                        <i data-lucide="shield-check" class="w-5 h-5"></i> Executar Auditoria
                    </button>
                </div>
            </div>
        </div>

        <div class="lg:col-span-7 flex flex-col gap-6">
            <div id="waitingState" class="flex flex-col items-center justify-center text-center p-12 bg-[#111111] border border-gray-800 rounded-2xl border-dashed h-full min-h-[400px] no-print">
                <i data-lucide="file-search" class="text-white opacity-20 w-16 h-16 mb-4"></i>
                <p class="text-xs uppercase tracking-widest opacity-40">Aguardando auditoria...</p>
            </div>
            <div id="resultsState" class="hidden-el flex flex-col fade-in space-y-6">
                <div id="taxesContainer" class="p-4 bg-[#080808] space-y-4 rounded-2xl border border-gray-800"></div>
            </div>
        </div>
    </main>

    <script>
        const GIST_ID = "969b06493ae7642340b3ba741e18959a";
        let REGRAS_DATA = {};
        let TABELA_CONVERSAO = {}; // Carregada do arquivo 'conversor cod serv.html'
        
        let state = {
            regime: 'normal', municipio: '', valorTotal: 0, valorMaterial: 0
        };

        async function init() {
            lucide.createIcons();
            await loadRegras();
            setupEvents();
            setupMasks();
        }

        async function loadRegras() {
            try {
                const url = `https://api.github.com/gists/${GIST_ID}?t=${new Date().getTime()}`;
                const res = await fetch(url);
                if(res.ok) {
                    const data = await res.json();
                    const files = data.files;
                    
                    // 1. Carrega regras fiscais principais
                    const mainFile = Object.keys(files).find(f => f.endsWith('.json') && f !== 'conversor cod serv.html');
                    REGRAS_DATA = JSON.parse(files[mainFile].content);
                    
                    // 2. Extrai dados do arquivo de conversão HTML
                    if(files['conversor cod serv.html']) {
                        const htmlContent = files['conversor cod serv.html'].content;
                        const match = htmlContent.match(/const rawCitiesData = ({[\s\S]*?});/);
                        if (match) {
                            // Limpeza simples para transformar o texto em objeto JS
                            const rawDataStr = match[1].replace(/(\w+):/g, '"$1":').replace(/'/g, '"');
                            const rawData = JSON.parse(rawDataStr);
                            
                            for (let cityKey in rawData) {
                                const cityId = cityKey.toUpperCase();
                                TABELA_CONVERSAO[cityId] = {};
                                rawData[cityKey].split(',').forEach(entry => {
                                    const [fed, mun, aliq] = entry.split(':');
                                    TABELA_CONVERSAO[cityId][mun] = {
                                        federal: fed,
                                        aliquota: aliq ? aliq.replace('%', '').replace(',', '.') : "5.00"
                                    };
                                });
                            }
                        }
                    }

                    popularSelect();
                    document.getElementById('statusText').textContent = "BANCO SINCRONIZADO";
                    document.getElementById('statusDot').className = "w-1.5 h-1.5 bg-green-500 rounded-full";
                }
            } catch(e) {
                document.getElementById('statusText').textContent = "ERRO DE CONEXÃO";
                document.getElementById('statusDot').className = "w-1.5 h-1.5 bg-red-500 rounded-full";
            }
        }

        function popularSelect() {
            const select = document.getElementById('codigoServico');
            select.innerHTML = '<option value="" disabled selected>-- Selecione o Código Federal --</option>';
            Object.keys(REGRAS_DATA).sort().forEach(k => {
                const opt = document.createElement('option');
                opt.value = k;
                opt.textContent = `${k} - ${REGRAS_DATA[k].desc.substring(0, 70)}...`;
                select.appendChild(opt);
            });
        }

        function setupEvents() {
            // Busca CNPJ e identifica Município
            document.getElementById('btnBuscarCnpj').onclick = async () => {
                const cnpj = document.getElementById('cnpjPrestador').value.replace(/\D/g, '');
                if(cnpj.length !== 14) return;
                const btn = document.getElementById('btnBuscarCnpj');
                btn.innerHTML = `<i data-lucide="refresh-cw" class="animate-spin w-4 h-4"></i>`; lucide.createIcons();
                try {
                    const res = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`);
                    const data = await res.json();
                    if(data.razao_social) {
                        // Identificação do município para o conversor
                        state.municipio = data.municipio.toUpperCase();
                        state.regime = data.opcao_pelo_mei ? 'mei' : (data.opcao_pelo_simples ? 'simples' : 'normal');
                        
                        document.getElementById('razaoSocialNome').textContent = data.razao_social;
                        document.getElementById('razaoSocialMunicipio').textContent = `${data.municipio} - ${data.uf}`;
                        document.getElementById('razaoSocialRegime').textContent = state.regime.toUpperCase();
                        document.getElementById('razaoSocialContainer').classList.remove('hidden-el');
                        
                        // Reseta campos de código para nova busca
                        document.getElementById('codMunicipal').value = '';
                        document.getElementById('codMunicipal').placeholder = `Cód. em ${data.municipio}`;
                    }
                } catch(e) {}
                btn.innerHTML = `<i data-lucide="search" class="w-4 h-4"></i>`; lucide.createIcons();
            };

            // Lógica de Ligação Automática (Municipal -> Federal + Alíquota)
            document.getElementById('codMunicipal').addEventListener('input', (e) => {
                const codMun = e.target.value.trim();
                const cidadeKey = state.municipio;

                if (cidadeKey && TABELA_CONVERSAO[cidadeKey] && TABELA_CONVERSAO[cidadeKey][codMun]) {
                    const dados = TABELA_CONVERSAO[cidadeKey][codMun];
                    
                    // Define o Código Federal
                    document.getElementById('codigoServico').value = dados.federal;
                    
                    // Define a Alíquota de ISS automaticamente
                    document.getElementById('aliqISS').value = dados.aliquota;
                    
                    // Dispara o evento de mudança para carregar regras de retenção do Gist
                    document.getElementById('codigoServico').dispatchEvent(new Event('change'));
                    
                    e.target.classList.add('border-green-500');
                    setTimeout(() => e.target.classList.remove('border-green-500'), 1500);
                }
            });

            document.getElementById('btnExecutarAuditoria').onclick = () => {
                const cod = document.getElementById('codigoServico').value;
                if(!cod || state.valorTotal <= 0) return;
                calcular();
            };
        }

        function calcular() {
            // Lógica simplificada de exibição de resultados baseada no REGRAS_DATA
            const cod = document.getElementById('codigoServico').value;
            const r = REGRAS_DATA[cod];
            const container = document.getElementById('taxesContainer');
            
            document.getElementById('waitingState').classList.add('hidden-el');
            document.getElementById('resultsState').classList.remove('hidden-el');
            container.innerHTML = `<h3 class="text-orange-500 font-black uppercase text-xs mb-4">Parecer para ${cod}</h3>`;
            
            const imps = ['iss', 'inss', 'ir', 'pcc'];
            imps.forEach(imp => {
                const val = r[imp] || "0";
                const item = document.createElement('div');
                item.className = "flex justify-between items-center p-3 border-b border-gray-800";
                item.innerHTML = `
                    <span class="text-[10px] font-bold uppercase">${imp.toUpperCase()}</span>
                    <span class="text-xs font-mono">${val}%</span>
                `;
                container.appendChild(item);
            });
        }

        function setupMasks() {
            document.getElementById('valorTotal').addEventListener('input', (e) => {
                let v = e.target.value.replace(/\D/g, '');
                let val = v ? parseFloat(v) / 100 : 0;
                state.valorTotal = val;
                e.target.value = val.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
            });
        }

        init();
    </script>
</body>
</html>
