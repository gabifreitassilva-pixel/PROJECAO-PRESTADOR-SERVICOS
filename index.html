<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlicoGabi</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; background: #7e57ff; }
        .nav { display: flex; overflow-x: auto; background: #7e57ff; padding: 10px; gap: 8px; }
        .nav button { 
            background: rgba(255,255,255,0.2); border: none; color: white; 
            padding: 8px 15px; border-radius: 20px; white-space: nowrap; font-weight: bold;
        }
        .nav button.active { background: white; color: #7e57ff; }
        iframe { width: 100%; height: calc(100% - 60px); border: none; background: white; border-radius: 20px 20px 0 0; }
    </style>
</head>
<body>
    <div class="nav">
        <button class="active" onclick="ir('home.html', this)">🏠 Home</button>
        <button onclick="ir('consulta e exames.HTML', this)">🩺 Consultas</button>
        <button onclick="ir('historico.HTML', this)">📅 Histórico</button>
        <button onclick="ir('ESTOQUE.HTML', this)">📦 Estoque</button>
        <button onclick="ir('ajuste.html', this)">⚙️ Ajustes</button>
        <button onclick="ir('lembretes .html', this)">🔔 Lembretes</button>
    </div>
    <iframe id="app" src="home.html"></iframe>

    <script>
        function ir(url, btn) {
            document.getElementById('app').src = url;
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>
