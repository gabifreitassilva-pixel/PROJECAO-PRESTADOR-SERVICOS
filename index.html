<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallel | Projeção Simples Nacional</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #050505; --card: #111; --primary: #ff6600; --border: #2a2a2a; --text: #e0e0e0; --success: #28a745; }
        * { box-sizing: border-box; }
        html, body { height: 100vh; width: 100vw; margin: 0; overflow: hidden; background-color: var(--bg); font-family: 'Segoe UI', sans-serif; color: var(--text); }
        body { padding: 5px; display: flex; align-items: center; justify-content: center; }

        .container { 
            width: 100%; max-width: 1200px; height: 98vh; 
            background: var(--card); padding: 8px 15px; border: 1px solid var(--border); 
            display: flex; flex-direction: column; gap: 2px;
        }

        header { border-bottom: 2px solid var(--primary); text-align: center; flex-shrink: 0; margin-bottom: 5px; }
        h1 { font-size: 1.2rem; color: var(--primary); margin: 0; text-transform: uppercase; letter-spacing: 2px; }

        .control-panel { display: flex; align-items: flex-end; gap: 10px; justify-content: space-between; flex-shrink: 0; margin-bottom: 5px; }
        .controls-left { display: flex; align-items: flex-end; gap: 8px; flex-grow: 1; }
        
        .input-group { display: flex; flex-direction: column; }
        label { font-size: 8px; color: #666; text-transform: uppercase; margin-bottom: 1px; font-weight: bold; }
        input { background: #1a1a1a; border: 1px solid var(--border); color: #fff; padding: 4px; font-size: 11px; outline: none; height: 26px; }
        
        .btn { border: none; padding: 0 12px; font-weight: bold; cursor: pointer; font-size: 9px; height: 26px; text-transform: uppercase; border-radius: 2px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-search { background: var(--primary); color: #000; }
        .btn-save { background: var(--success); color: #fff; }

        .anexo-selector-horizontal { display: flex; gap: 10px; background: #1a1a1a; padding: 4px 10px; border: 1px solid var(--border); }
        .anexo-item { font-size: 9px; display: flex; align-items: center; color: #aaa; cursor: pointer; gap: 3px; }

        .company-info-block { border-left: 3px solid var(--primary); padding-left: 8px; flex-shrink: 0; margin-bottom: 5px; }
        .info-cnpj { font-size: 0.9rem; font-weight: bold; color: #fff; }
        .info-details { font-size: 0.8rem; color: #888; }

        .table-wrap { flex-grow: 1; overflow-y: auto; border: 1px solid var(--border); background: #0a0a0a; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; table-layout: fixed; }
        th { background: #1a1a1a; color: var(--primary); padding: 4px; border: 1px solid var(--border); position: sticky; top: 0; z-index: 10; font-size: 9px; }
        td { padding: 1px 5px; border: 1px solid var(--border); height: 22px; }
        
        .col-mes { width: 70px; text-align: center; }
        .col-fat { width: 130px; }
        .col-rbt { width: 150px; }
        .col-ali { width: 65px; text-align: center; }
        .col-imp { width: 130px; }
        
        .cell-input { width: 100%; background: transparent; border: none; color: #fff; text-align: right; font-family: 'Consolas', monospace; font-size: 11px; outline: none; }
        .total-row { background: #1a1a1a; font-weight: bold; color: var(--primary); position: sticky; bottom: 0; font-size: 11px; }

        .db-icon { color: #444; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; height: 26px; }
        .db-icon:hover { color: var(--primary); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; }
        .modal-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #0d0d0d; border: 1px solid var(--primary); padding: 15px; width: 600px; max-height: 80vh; overflow-y: auto; }
        .db-table { width: 100%; border-collapse: collapse; color: #e0e0e0; font-size: 11px; }
        .db-table th { color: var(--primary); border-bottom: 1px solid #333; padding: 8px; text-align: left; }
        .db-table td { border-bottom: 1px solid #222; padding: 6px 8px; }
    </style>
</head>
<body>

<div class="container">
    <header><h1>PROJEÇÃO SIMPLES NACIONAL</h1></header>

    <div class="control-panel">
        <div class="controls-left">
            <div class="input-group">
                <label>CNPJ</label>
                <input type="text" id="cnpjInput" maxlength="18" placeholder="00.000.000/0000-00" oninput="mascaraCNPJ(this)">
            </div>
            <button class="btn btn-search" onclick="buscarCNPJ()">Consultar</button>
            <button class="btn btn-save" onclick="salvarProjecao()">Salvar</button>
            <div class="input-group">
                <label>Atividades</label>
                <div class="anexo-selector-horizontal" id="anexoChecks">
                    <label class="anexo-item"><input type="checkbox" value="3" checked onchange="calcular()"> Anexo III</label>
                    <label class="anexo-item"><input type="checkbox" value="4" onchange="calcular()"> Anexo IV</label>
                    <label class="anexo-item"><input type="checkbox" value="5" onchange="calcular()"> Anexo V</label>
                </div>
            </div>
        </div>
        <div class="db-icon" onclick="abrirBancoDeDados()"><i class="fas fa-database"></i></div>
    </div>

    <div id="companyDisplay" class="company-info-block" style="display: none;">
        <div id="displayCNPJ" class="info-cnpj"></div>
        <div class="info-details"><span id="displayNome"></span> | Abertura: <span id="displayData" style="color:#fff"></span></div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th class="col-mes">Mês/Ano</th>
                    <th class="col-fat">Faturamento (R$)</th>
                    <th class="col-rbt">RBT12 Projetada</th>
                    <th class="col-ali">Aliq. Ef.</th>
                    <th class="col-imp">Imposto</th>
                </tr>
            </thead>
            <tbody id="mainTable"></tbody>
            <tfoot>
                <tr class="total-row">
                    <td>TOTAL</td>
                    <td id="totFat" style="text-align: right;">R$ 0,00</td>
                    <td></td>
                    <td></td>
                    <td id="totImp" style="text-align: right;">R$ 0,00</td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>

<div id="dbModal" class="modal">
    <div class="modal-content">
        <h4 style="color:var(--primary); text-transform:uppercase; margin: 0 0 10px 0;">Histórico de Projeções</h4>
        <table class="db-table">
            <thead>
                <tr>
                    <th>Empresa / CNPJ</th>
                    <th>Data Salvo</th>
                    <th style="text-align:center">Ação</th>
                </tr>
            </thead>
            <tbody id="dbList"></tbody>
        </table>
        <div style="margin-top:15px; text-align: right;"><button class="btn btn-search" onclick="document.getElementById('dbModal').style.display='none'">Fechar</button></div>
    </div>
</div>

<script>
    const anexos = {
        3: [{l:180000, a:0.06, d:0}, {l:360000, a:0.112, d:9360}, {l:720000, a:0.135, d:17640}, {l:1800000, a:0.16, d:35640}, {l:3600000, a:0.21, d:125640}, {l:4800000, a:0.33, d:648000}],
        4: [{l:180000, a:0.045, d:0}, {l:360000, a:0.09, d:8100}, {l:720000, a:0.102, d:12420}, {l:1800000, a:0.14, d:39780}, {l:3600000, a:0.22, d:183780}, {l:4800000, a:0.33, d:828000}],
        5: [{l:180000, a:0.155, d:0}, {l:360000, a:0.18, d:4500}, {l:720000, a:0.195, d:9900}, {l:1800000, a:0.205, d:17100}, {l:3600000, a:0.23, d:62100}, {l:4800000, a:0.305, d:540000}]
    };

    let dataAberturaBase = new Date();
    let nomeEmpresaGlobal = "";

    function mascaraCNPJ(i) {
        let v = i.value.replace(/\D/g, "");
        v = v.replace(/^(\d{2})(\d)/, "$1.$2").replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3").replace(/\.(\d{3})(\d)/, ".$1/$2").replace(/(\d{4})(\d)/, "$1-$2");
        i.value = v;
    }

    function formatarMoedaInput(input) {
        let valor = input.value.replace(/\D/g, "");
        valor = (valor / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        input.value = valor === "0,00" ? "" : valor;
        calcular();
    }

    function conv(v) { return v ? parseFloat(v.replace(/\./g, "").replace(",", ".")) : 0; }

    async function buscarCNPJ() {
        const cnpj = document.getElementById('cnpjInput').value.replace(/\D/g, '');
        if(cnpj.length !== 14) return;
        try {
            const res = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`);
            const data = await res.json();
            const p = data.data_inicio_atividade.split('-');
            dataAberturaBase = new Date(p[0], p[1]-1, p[2]);
            nomeEmpresaGlobal = data.razao_social;
            document.getElementById('displayCNPJ').innerText = document.getElementById('cnpjInput').value;
            document.getElementById('displayNome').innerText = nomeEmpresaGlobal;
            document.getElementById('displayData').innerText = dataAberturaBase.toLocaleDateString('pt-BR');
            document.getElementById('companyDisplay').style.display = 'block';
            gerarTabela();
        } catch (e) { alert("CNPJ não encontrado."); }
    }

    function gerarTabela() {
        const tbody = document.getElementById('mainTable');
        tbody.innerHTML = '';
        for(let i=0; i < 14; i++) {
            const d = new Date(dataAberturaBase);
            d.setMonth(d.getMonth() + i);
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="col-mes">${d.toLocaleDateString('pt-BR', {month:'2-digit', year:'numeric'})}</td>
                <td class="col-fat"><input type="text" class="cell-input fat-in" placeholder="0,00" oninput="formatarMoedaInput(this)"></td>
                <td class="rbt-val" style="text-align: right; color:#555">R$ 0,00</td>
                <td class="aliq-val">0,00%</td>
                <td class="imp-val" style="text-align: right; font-weight: bold;">R$ 0,00</td>
            `;
            tbody.appendChild(tr);
        }
    }

    function calcular() {
        const inputs = document.querySelectorAll('.fat-in');
        const selecionados = Array.from(document.querySelectorAll('#anexoChecks input:checked')).map(c => c.value);
        let tFat = 0, tImp = 0;

        inputs.forEach((input, i) => {
            const fat = conv(input.value);
            tFat += fat;
            let acumulado = Array.from(inputs).slice(0, i).reduce((a, b) => a + conv(b.value), 0);
            
            // Lógica PGDAS THRYA BUSINESS: RBT12p base de 258.000,00 
            let rbt = i === 0 ? (258000) : (258000 + acumulado);

            let maiorImp = 0, aliqEf = 0;
            selecionados.forEach(an => {
                const f = anexos[an].find(x => rbt <= x.l) || anexos[an][5];
                let ef = ((rbt * f.a) - f.d) / rbt;
                if (ef < 0 || isNaN(ef)) ef = f.a;
                if (fat * ef > maiorImp) { maiorImp = fat * ef; aliqEf = ef; }
            });
            tImp += maiorImp;
            const row = document.getElementById('mainTable').children[i];
            if(row) {
                row.querySelector('.rbt-val').innerText = rbt.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
                row.querySelector('.aliq-val').innerText = (aliqEf * 100).toFixed(2) + '%';
                row.querySelector('.imp-val').innerText = maiorImp.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
            }
        });
        document.getElementById('totFat').innerText = tFat.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
        document.getElementById('totImp').innerText = tImp.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
    }

    function salvarProjecao() {
        if(!nomeEmpresaGlobal) return alert("Consulte um CNPJ primeiro.");
        const inputs = Array.from(document.querySelectorAll('.fat-in')).map(i => i.value);
        const dados = { 
            id: Date.now(), 
            empresa: nomeEmpresaGlobal, 
            cnpj: document.getElementById('cnpjInput').value, 
            abertura: document.getElementById('displayData').innerText,
            faturamentos: inputs,
            dataHora: new Date().toLocaleString('pt-BR') 
        };
        let banco = JSON.parse(localStorage.getItem('parallel_db')) || [];
        banco.push(dados);
        localStorage.setItem('parallel_db', JSON.stringify(banco));
        alert("Projeção salva com sucesso!");
    }

    function abrirBancoDeDados() {
        const lista = document.getElementById('dbList');
        lista.innerHTML = '';
        let banco = JSON.parse(localStorage.getItem('parallel_db')) || [];
        if(banco.length === 0) {
            lista.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:10px">Vazio</td></tr>';
        } else {
            banco.reverse().forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${item.empresa}<br><small>${item.cnpj}</small></td><td>${item.dataHora}</td><td style="text-align:center"><i class="fas fa-eye" style="cursor:pointer;color:var(--primary)" onclick="carregarProjecao(${item.id})"></i></td>`;
                lista.appendChild(tr);
            });
        }
        document.getElementById('dbModal').style.display = 'block';
    }

    function carregarProjecao(id) {
        let banco = JSON.parse(localStorage.getItem('parallel_db')) || [];
        const item = banco.find(p => p.id === id);
        if(!item) return;

        document.getElementById('cnpjInput').value = item.cnpj;
        document.getElementById('displayCNPJ').innerText = item.cnpj;
        document.getElementById('displayNome').innerText = item.empresa;
        document.getElementById('displayData').innerText = item.abertura;
        document.getElementById('companyDisplay').style.display = 'block';
        nomeEmpresaGlobal = item.empresa;

        gerarTabela();
        const inputs = document.querySelectorAll('.fat-in');
        item.faturamentos.forEach((val, idx) => {
            if(inputs[idx]) inputs[idx].value = val;
        });
        calcular();
        document.getElementById('dbModal').style.display = 'none';
    }

    window.onload = gerarTabela;
</script>
</body>
</html>
