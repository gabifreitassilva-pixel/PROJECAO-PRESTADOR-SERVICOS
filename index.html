<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GlicoGabi</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7e57ff">
    <style>
        :root { --primaria: #7e57ff; }
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background-color: #f0f0f0; display: flex; justify-content: center;
        }
        /* Moldura Roxa principal */
        .outer-frame {
            background-color: var(--primaria);
            width: 100%; max-width: 450px; height: 100vh;
            display: flex; flex-direction: column;
            border: 8px solid var(--primaria);
        }
        /* Menu de abas dentro da moldura */
        .nav-tabs {
            display: flex; overflow-x: auto; padding: 10px 5px; gap: 8px;
            scrollbar-width: none; -webkit-overflow-scrolling: touch;
        }
        .nav-tabs::-webkit-scrollbar { display: none; }
        .tab-btn {
            background: rgba(255,255,255,0.2); border: none; color: white;
            padding: 8px 15px; border-radius: 20px; white-space: nowrap;
            font-weight: bold; font-size: 12px; cursor: pointer;
        }
        .tab-btn.active { background: white; color: var(--primaria); }
        /* Área branca do conteúdo */
        .content-container {
            flex: 1; background: white; border-radius: 25px 25px 0 0;
            overflow: hidden; position: relative;
        }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div class="outer-frame">
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="navegar('home.HTML', this)">🏠 Home</button>
            <button class="tab-btn" onclick="navegar('consulta e exames.HTML', this)">🩺 Consultas</button>
            <button class="tab-btn" onclick="navegar('historico.HTML', this)">📅 Histórico</button>
            <button class="tab-btn" onclick="navegar('ESTOQUE.HTML', this)">📦 Estoque</button>
            <button class="tab-btn" onclick="navegar('ajuste.html', this)">⚙️ Ajustes</button>
            <button class="tab-btn" onclick="navegar('lembretes .html', this)">🔔 Lembretes</button>
        </div>
        <div class="content-container">
            <iframe id="janela" src="home.html"></iframe>
        </div>
    </div>
    <script>
        function navegar(url, btn) {
            document.getElementById('janela').src = url;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
