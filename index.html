<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GlicoGabi - Menu</title>
    
    <link rel="manifest" href="MANIFEST.JSON">
    <link rel="icon" type="image/png" href="icon.png">
    <meta name="theme-color" content="#7e57ff">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        /* Estilos do seu menu */
        :root { --primaria: #7e57ff; --lavanda: #f4f0ff; }
        body { font-family: 'Segoe UI', sans-serif; background: white; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .menu-container { text-align: center; width: 90%; max-width: 400px; }
        .logo-app { width: 120px; height: 120px; border-radius: 25px; margin-bottom: 20px; border: 4px solid var(--primaria); }
        .btn-menu { background: var(--lavanda); color: var(--primaria); text-decoration: none; padding: 18px; border-radius: 15px; display: block; margin-bottom: 12px; font-weight: bold; font-size: 18px; border: 1px solid #ddd; }
        .btn-menu:active { background: #e3d9ff; }
    </style>
</head>
<body>
    <div class="menu-container">
        <img src="icon.png" class="logo-app" alt="GlicoGabi">
        <h2>GlicoGabi</h2>
        <a href="HOME.HTML" class="btn-menu">📊 Lançamentos</a>
        <a href="ESTOQUES.HTML" class="btn-menu">📦 Estoque</a>
        <a href="AJUSTES.HTML" class="btn-menu">⚙️ Relatórios / Ajustes</a>
    </div>

    <script>
        // Registro do Service Worker para funcionar offline
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('SW.JS')
            .then(() => console.log("GlicoGabi: App pronto para uso offline."))
            .catch(err => console.log("Erro ao registrar App:", err));
        }
    </script>
</body>
