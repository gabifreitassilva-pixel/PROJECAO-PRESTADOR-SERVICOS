<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlicoGabi - Ajustes</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --primaria: #7e57ff; --lavanda: #f4f0ff; --lavanda-medio: #e3d9ff; }
        body { font-family: 'Segoe UI', sans-serif; background: white; margin: 0; padding: 0; }
        .container { background: white; width: 100%; min-height: 100vh; padding-bottom: 30px; display: flex; flex-direction: column; }
        .header { background: var(--primaria); color: white; text-align: center; padding: 15px; }
        .tabs { display: flex; background: var(--lavanda); margin: 10px 15px; border-radius: 12px; padding: 5px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; font-weight: bold; color: var(--primaria); cursor: pointer; border-radius: 8px; }
        .tab-btn.active { background: white; box-shadow: 0 2px 5px rgba(0,0,0,.1); }
        .section-box { background: var(--lavanda); margin: 0 15px 15px; padding: 15px; border-radius: 20px; border: 1px solid var(--lavanda-medio); }
        input, select { padding: 12px; border-radius: 10px; border: 1px solid #ddd; font-size: 14px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        .btn-acao { background: var(--primaria); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; }
        th { background: var(--primaria); color: white; padding: 10px; font-size: 12px; text-align: left; }
        td { padding: 12px 10px; border-bottom: 1px solid #eee; font-size: 14px; }
        .hidden { display: none !important; }
        #modalRelatorio { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 999; display: none; overflow: auto; }
        .folha { padding: 10mm; width: 210mm; margin: auto; }
        .tab-rel { width: 100%; border-collapse: collapse; font-size: 8pt; table-layout: fixed; }
        .tab-rel th, .tab-rel td { border: 1px solid #333; padding: 4px; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h3>Ajustes GlicoGabi</h3></div>
    <div class="tabs">
        <button id="btnDoses" class="tab-btn active" onclick="toggleAba('doses')">Minhas Doses</button>
        <button id="btnConfig" class="tab-btn" onclick="toggleAba('config')">Configurar</button>
    </div>
    
    <div id="abaConfig" class="hidden">
        <div class="section-box">
            <input type="hidden" id="editIdx" value="-1">
            <label>NOME DO MEDICAMENTO</label>
            <input type="text" id="nomeMed" placeholder="Ex: NPH Manhã">
            <label>DOSE (UI ou mg)</label>
            <input type="text" id="qtdMed" placeholder="Ex: 15 UI">
            <button class="btn-acao" onclick="salvarDose()">Salvar Medicamento</button>
        </div>
    </div>

    <div id="abaDoses">
        <div class="section-box" style="padding:5px">
            <table><thead><tr><th>Medicamento</th><th>Dose</th><th>Ações</th></tr></thead><tbody id="listaMeds"></tbody></table>
        </div>
        <div class="section-box">
            <label>Mês e Ano do Relatório</label>
            <select id="selMes">
                <option value="1">Janeiro</option><option value="2">Fevereiro</option><option value="3">Março</option>
                <option value="4">Abril</option><option value="5">Maio</option><option value="6">Junho</option>
                <option value="7">Julho</option><option value="8">Agosto</option><option value="9">Setembro</option>
                <option value="10" selected>Outubro</option><option value="11">Novembro</option><option value="12">Dezembro</option>
            </select>
            <input type="number" id="selAno" value="2024">
            <button class="btn-acao" onclick="verRelatorio()">Gerar Relatório PDF</button>
        </div>
    </div>
</div>

<div id="modalRelatorio">
    <div style="background:var(--primaria); color:white; padding:10px; display:flex; justify-content:space-between;">
        <b>RELATÓRIO MENSAL</b>
        <button onclick="document.getElementById('modalRelatorio').style.display='none'">X FECHAR</button>
    </div>
    <div id="areaRel" class="folha">
        <h2 style="text-align:center">CONTROLE GLICÊMICO - <span id="txtMes"></span>/<span id="txtAno"></span></h2>
        <table class="tab-rel">
            <thead>
                <tr>
                    <th rowspan="2" style="width:10mm">Dia</th><th colspan="2">Café</th><th colspan="2">Almoço</th><th colspan="2">Jantar</th><th rowspan="2">Dormir</th>
                </tr>
                <tr><th>Antes</th><th>Depois</th><th>Antes</th><th>Depois</th><th>Antes</th><th>Depois</th></tr>
            </thead>
            <tbody id="corpoRel"></tbody>
        </table>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('gabi_ajustes_vFinal')) || [];

    function toggleAba(aba) {
        document.getElementById('abaDoses').classList.toggle('hidden', aba !== 'doses');
        document.getElementById('abaConfig').classList.toggle('hidden', aba !== 'config');
        if(aba === 'doses') render();
    }

    function salvarDose() {
        const nome = document.getElementById('nomeMed').value;
        const qtd = document.getElementById('qtdMed').value;
        if(!nome || !qtd) return alert("Preencha!");
        db.push({nome, qtd});
        localStorage.setItem('gabi_ajustes_vFinal', JSON.stringify(db));
        document.getElementById('nomeMed').value = ""; document.getElementById('qtdMed').value = "";
        toggleAba('doses');
    }

    function render() {
        document.getElementById('listaMeds').innerHTML = db.map((m, i) => `
            <tr><td>${m.nome}</td><td>${m.qtd}</td><td><button onclick="remover(${i})">❌</button></td></tr>
        `).join('');
    }

    function remover(i) { db.splice(i, 1); localStorage.setItem('gabi_ajustes_vFinal', JSON.stringify(db)); render(); }

    function verRelatorio() {
        const mes = parseInt(document.getElementById('selMes').value);
        const ano = parseInt(document.getElementById('selAno').value);
        document.getElementById('txtMes').innerText = mes;
        document.getElementById('txtAno').innerText = ano;
        const historico = JSON.parse(localStorage.getItem('gabi_historico_glicemias') || '[]');
        const diasNoMes = new Date(ano, mes, 0).getDate();
        let h = "";
        for(let i=1; i<=diasNoMes; i++) {
            const diaDados = historico.filter(d => {
                const p = d.data.split('-');
                return parseInt(p[2]) === i && parseInt(p[1]) === mes && parseInt(p[0]) === ano;
            });
            const b = (m) => diaDados.find(d => d.momento.toLowerCase().includes(m.toLowerCase()))?.valor || "";
            h += `<tr><td>${i}</td><td>${b('Jejum')}</td><td>${b('Pós café')}</td><td>${b('Antes do almoço')}</td><td>${b('Depois do almoço')}</td><td>${b('Antes da janta')}</td><td>${b('Depois da janta')}</td><td>${b('Dormir')}</td></tr>`;
        }
        document.getElementById('corpoRel').innerHTML = h;
        document.getElementById('modalRelatorio').style.display = "block";
    }

    render();
</script>
</body>
</html>
