<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlicoGabi - Ajustes</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --primaria: #7e57ff; --lavanda: #f4f0ff; --lavanda-medio: #e3d9ff; }
        body { font-family: 'Segoe UI', sans-serif; background: white; margin: 0; padding: 0; overflow-x: hidden; }
        .container { background: white; width: 100%; min-height: 100vh; padding-bottom: 30px; display: flex; flex-direction: column; }
        .header { background: var(--primaria); color: white; text-align: center; padding: 15px; }
        .tabs { display: flex; background: var(--lavanda); margin: 10px 15px; border-radius: 12px; padding: 5px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; font-weight: bold; color: var(--primaria); cursor: pointer; border-radius: 8px; }
        .tab-btn.active { background: white; box-shadow: 0 2px 5px rgba(0,0,0,.1); }
        .section-box { background: var(--lavanda); margin: 0 15px 15px; padding: 15px; border-radius: 20px; border: 1px solid var(--lavanda-medio); }
        input, select { padding: 12px; border-radius: 10px; border: 1px solid #ddd; font-size: 14px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        .btn-acao { background: var(--primaria); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 8px; }
        .btn-pdf { background: #9b59b6; } .btn-wpp { background: #25d366; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; }
        th { background: var(--primaria); color: white; padding: 10px; font-size: 12px; text-align: left; }
        td { padding: 12px 10px; border-bottom: 1px solid #eee; font-size: 14px; }
        .hidden { display: none !important; }

        #modalRelatorio { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; display: none; overflow: auto; padding: 20px 0; }
        .rel-topo { background: var(--primaria); color: white; padding: 15px; display: flex; justify-content: space-between; position: sticky; top: -20px; width: 100%; box-sizing: border-box; }
        .folha { padding: 10mm; width: 277mm; margin: auto; background: white; color: black; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .tab-rel { width: 100%; border-collapse: collapse; font-size: 8.5pt; table-layout: fixed; margin-top: 10px; }
        .tab-rel th { border: 1px solid #333; padding: 6px; background: #eee !important; color: black; font-weight: bold; }
        .tab-rel td { border: 1px solid #333; padding: 5px; text-align: center; height: 8mm; color: black; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h3>Ajustes GlicoGabi</h3></div>
    <div class="tabs">
        <button id="btnDoses" class="tab-btn active" onclick="toggleAba('doses')">Minhas Doses</button>
        <button id="btnConfig" class="tab-btn" onclick="toggleAba('config')">Configurar</button>
    </div>
    
    <div id="abaConfig" class="hidden">
        <div class="section-box">
            <input type="text" id="nomeMed" placeholder="Medicação (Ex: Insulina NPH)">
            <input type="text" id="qtdMed" placeholder="Dose (Ex: 15 UI)">
            <button class="btn-acao" onclick="salvarDose()">Salvar para a Home</button>
        </div>
    </div>

    <div id="abaDoses">
        <div class="section-box" style="padding:5px">
            <table><thead><tr><th>Medicação</th><th>Dose</th><th>Ações</th></tr></thead><tbody id="listaMeds"></tbody></table>
        </div>
        <div class="section-box">
            <input type="text" id="wppInput" placeholder="WhatsApp (DDD + Número)">
            <div style="display: flex; gap: 5px;">
                <select id="selMes" style="flex: 2;">
                    <option value="">Selecione o Mês...</option>
                    <option value="1">Janeiro</option><option value="2">Fevereiro</option><option value="3">Março</option>
                    <option value="4">Abril</option><option value="5">Maio</option><option value="6">Junho</option>
                    <option value="7">Julho</option><option value="8">Agosto</option><option value="9">Setembro</option>
                    <option value="10">Outubro</option><option value="11">Novembro</option><option value="12">Dezembro</option>
                </select>
                <input type="number" id="selAno" style="flex: 1;" placeholder="Ano (Ex: 2024)">
            </div>
            <button class="btn-acao" onclick="verRelatorio()">1. Visualizar Relatório</button>
            <button class="btn-acao btn-pdf" onclick="exportarPDF()">2. Baixar PDF Completo</button>
            <button class="btn-acao btn-wpp" onclick="enviarWpp()">3. Enviar por WhatsApp</button>
        </div>
    </div>
</div>

<div id="modalRelatorio">
    <div class="rel-topo"><b>RELATÓRIO MENSAL</b><button onclick="document.getElementById('modalRelatorio').style.display='none'">FECHAR X</button></div>
    <div id="areaRel" class="folha">
        <h2 style="text-align:center; color: #7e57ff; margin-bottom: 5px;">PLANILHA DE CONTROLE GLICÊMICO</h2>
        <h3 style="text-align:center; margin-top: 0;">MÊS/ANO: <span id="txtMes"></span> / <span id="txtAno"></span></h3>
        <table class="tab-rel">
            <thead>
                <tr>
                    <th rowspan="2" style="width:12mm">Dia</th><th colspan="2">Café da Manhã</th><th colspan="2">Almoço</th><th colspan="2">Jantar</th><th rowspan="2">Dormir</th><th rowspan="2">Anotações</th>
                </tr>
                <tr><th>Antes</th><th>Depois</th><th>Antes</th><th>Depois</th><th>Antes</th><th>Depois</th></tr>
            </thead>
            <tbody id="corpoRel"></tbody>
        </table>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('gabi_ajustes_vFinal')) || [];
    const mesesNomes = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

    function toggleAba(aba) { 
        document.getElementById('abaDoses').classList.toggle('hidden', aba !== 'doses'); 
        document.getElementById('abaConfig').classList.toggle('hidden', aba !== 'config'); 
        document.getElementById('btnDoses').classList.toggle('active', aba === 'doses');
        document.getElementById('btnConfig').classList.toggle('active', aba === 'config');
        if(aba === 'doses') render(); 
    }

    function salvarDose() { 
        const nome = document.getElementById('nomeMed').value; 
        const qtd = document.getElementById('qtdMed').value; 
        if(!nome || !qtd) return alert("Preencha!"); 
        db.push({nome, qtd}); 
        localStorage.setItem('gabi_ajustes_vFinal', JSON.stringify(db)); 
        document.getElementById('nomeMed').value = "";
        document.getElementById('qtdMed').value = "";
        toggleAba('doses'); 
    }

    function render() { 
        document.getElementById('listaMeds').innerHTML = db.map((m, i) => `<tr><td>${m.nome}</td><td>${m.qtd}</td><td><button onclick="remover(${i})">❌</button></td></tr>`).join(''); 
    }

    function remover(i) { 
        if(confirm("Remover esta medicação?")) {
            db.splice(i, 1); 
            localStorage.setItem('gabi_ajustes_vFinal', JSON.stringify(db)); 
            render(); 
        }
    }

    function verRelatorio() { 
        const mesVal = document.getElementById('selMes').value;
        const anoVal = document.getElementById('selAno').value;
        if(!mesVal || !anoVal) return alert("Por favor, selecione o Mês e digite o Ano.");
        const mes = parseInt(mesVal); 
        const ano = parseInt(anoVal); 
        document.getElementById('txtMes').innerText = mesesNomes[mes-1].toUpperCase(); 
        document.getElementById('txtAno').innerText = ano; 
        const historico = JSON.parse(localStorage.getItem('gabi_historico_glicemias') || '[]'); 
        const diasNoMes = new Date(ano, mes, 0).getDate(); 
        let h = ""; 
        for(let i=1; i<=diasNoMes; i++) { 
            const diaDados = historico.filter(d => {
                const parts = d.data.split('/');
                return parseInt(parts[0]) === i && parseInt(parts[1]) === mes && parseInt(parts[2]) === ano;
            });
            const b = (mom) => diaDados.find(d => d.momento.toLowerCase().includes(mom.toLowerCase()))?.valor || "";
            h += `<tr><td>${i}</td><td>${b('Jejum')}</td><td>${b('Pós café')}</td><td>${b('Antes do almoço')}</td><td>${b('Depois do almoço')}</td><td>${b('Antes da janta')}</td><td>${b('Depois da janta')}</td><td>${b('Madrugada')}</td><td></td></tr>`; 
        } 
        document.getElementById('corpoRel').innerHTML = h; 
        document.getElementById('modalRelatorio').style.display = "block"; 
    }

    function exportarPDF() { 
        if(!document.getElementById('selMes').value || !document.getElementById('selAno').value) return alert("Selecione Mês e Ano antes.");
        verRelatorio();
        const element = document.getElementById('areaRel');
        const opt = { 
            margin: [5, 5, 5, 5], 
            filename: `Relatorio_Glicemia_${document.getElementById('selMes').value}_${document.getElementById('selAno').value}.pdf`, 
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
        }; 
        html2pdf().from(element).set(opt).save(); 
    }

    function enviarWpp() { 
        const num = document.getElementById('wppInput').value; 
        if(!num) return alert("Informe o número!");
        window.open(`https://wa.me/55${num}?text=${encodeURIComponent('Segue meu relatório GlicoGabi mensal.')}`); 
    }

    render();
</script>
</body>
</html>
