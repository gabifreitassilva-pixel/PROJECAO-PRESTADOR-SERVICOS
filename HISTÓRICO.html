<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlicoGabi - Linha do Tempo</title>
    <style>
        :root { --primaria: #7e57ff; --laranja: #ff9800; --lavanda: #f4f0ff; }
        body { font-family: 'Segoe UI', sans-serif; background: white; margin: 0; padding: 0; }
        .container { width: 100%; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 30px; }
        .header { background-color: var(--primaria); color: white; padding: 30px 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 28px; }
        .input-area { background-color: var(--lavanda); margin: 15px; padding: 20px; border-radius: 20px; display: flex; flex-direction: column; gap: 12px; border: 1px solid #e3d9ff; }
        label { font-size: 11px; font-weight: bold; color: var(--primaria); text-transform: uppercase; }
        input, select, textarea { padding: 12px; border-radius: 12px; border: 1px solid #ddd; font-size: 14px; outline: none; }
        button#btn-salvar { background-color: var(--laranja); color: white; border: none; padding: 15px; border-radius: 15px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .history-list { padding: 0 15px 20px; }
        .group-card { background: white; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; border-left: 6px solid var(--primaria); overflow: hidden; }
        .group-header { padding: 10px 15px; background: #f9f9f9; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; color: var(--primaria); }
        .btn-del { background: #ffeded; color: #ff4444; border: none; padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 11px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>Linha do Tempo</h1><p>Evolução da Gabriela</p></div>
    <div class="input-area">
        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label>Mês</label>
                <select id="mes" style="width:100%">
                    <option value="1">Janeiro</option>
                    <option value="2">Fevereiro</option>
                    <option value="3">Março</option>
                    <option value="4">Abril</option>
                    <option value="5">Maio</option>
                    <option value="6">Junho</option>
                    <option value="7">Julho</option>
                    <option value="8">Agosto</option>
                    <option value="9" selected>Setembro</option>
                    <option value="10">Outubro</option>
                    <option value="11">Novembro</option>
                    <option value="12">Dezembro</option>
                </select>
            </div>
            <div style="flex: 1;"><label>Ano</label><input type="number" id="ano" value="2024" style="width:100%"></div>
        </div>
        <label>Descrição do Evento ou Evolução</label>
        <textarea id="descricao" rows="3" placeholder="Ex: Começou a usar a nova insulina..."></textarea>
        <button id="btn-salvar" onclick="salvarHistorico()">Salvar Dados</button>
    </div>
    <div id="historicoEventos" class="history-list"></div>
</div>

<script>
    // Carrega eventos salvos anteriormente
    let eventos = JSON.parse(localStorage.getItem('gabi_linha_tempo') || '[]');

    function salvarHistorico() {
        const selectMes = document.getElementById('mes');
        const mesTexto = selectMes.options[selectMes.selectedIndex].text;
        const mesValor = parseInt(selectMes.value);
        const ano = document.getElementById('ano').value;
        const desc = document.getElementById('descricao').value;

        if (!desc) return alert("Preencha a descrição!");

        const novoEvento = { 
            id: Date.now(), 
            mesNome: mesTexto,
            mesNum: mesValor,
            ano: ano, 
            descricao: desc, 
            timestamp: (parseInt(ano) * 12) + mesValor 
        };

        eventos.push(novoEvento);
        // Ordena por data (mais antigo para o mais novo)
        eventos.sort((a, b) => a.timestamp - b.timestamp);
        
        localStorage.setItem('gabi_linha_tempo', JSON.stringify(eventos));
        renderizar();
        document.getElementById('descricao').value = "";
    }

    function excluirEvento(id) {
        if(confirm("Deseja remover este registro?")) {
            eventos = eventos.filter(e => e.id !== id);
            localStorage.setItem('gabi_linha_tempo', JSON.stringify(eventos));
            renderizar();
        }
    }

    function renderizar() {
        const lista = document.getElementById('historicoEventos'); 
        lista.innerHTML = "";
        
        eventos.forEach(e => {
            lista.innerHTML += `
                <div class="group-card">
                    <div class="group-header">
                        <span>📅 ${e.mesNome} de ${e.ano}</span>
                        <button class="btn-del" onclick="excluirEvento(${e.id})">Remover</button>
                    </div>
                    <div style="padding:15px; line-height: 1.5; color: #444;">${e.descricao}</div>
                </div>`;
        });
    }

    // Inicializa a lista ao carregar a página
    renderizar();
</script>
</body>
</html>
