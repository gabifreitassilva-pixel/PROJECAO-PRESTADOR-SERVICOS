<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlicoGabi - Ajustes</title>

<style>
body{
    margin:0;
    font-family:Segoe UI, sans-serif;
    background:#f2f2f2;
}
.container{
    max-width:900px;
    margin:auto;
    background:#fff;
    min-height:100vh;
    padding:15px;
}
h2,h3{
    margin-top:10px;
}
.section{
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    background:#fafafa;
    border:1px solid #ddd;
}
input,select,button{
    padding:8px;
    margin-top:5px;
    border-radius:6px;
    border:1px solid #ccc;
}
button{
    background:#7e57ff;
    color:#fff;
    font-weight:bold;
    border:none;
    cursor:pointer;
}
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
    font-size:12px;
}
th,td{
    border:1px solid #ccc;
    padding:5px;
    text-align:center;
}
th{
    background:#7e57ff;
    color:#fff;
}
.flex{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}
.box{
    flex:1;
    min-width:120px;
}
</style>
</head>

<body>
<div class="container">

<h2>⚙️ Ajustes – GlicoGabi</h2>

<!-- ================= DOSES ================= -->
<div class="section">
<h3>Doses Padrão</h3>

<div class="flex">
    <div class="box">
        <label>NPH (un)</label>
        <input type="number" id="dose_nph">
    </div>
    <div class="box">
        <label>Regular (un)</label>
        <input type="number" id="dose_regular">
    </div>
    <div class="box">
        <label>Metformina (mg)</label>
        <input type="number" id="dose_metformina">
    </div>
</div>

<button onclick="salvarDoses()">Salvar Doses</button>
</div>

<!-- ================= RELATÓRIO ================= -->
<div class="section">
<h3>Relatório Mensal</h3>

<select id="mes" onchange="carregarRelatorio()">
<option value="01">Janeiro</option>
<option value="02">Fevereiro</option>
<option value="03">Março</option>
<option value="04">Abril</option>
<option value="05">Maio</option>
<option value="06">Junho</option>
<option value="07">Julho</option>
<option value="08">Agosto</option>
<option value="09">Setembro</option>
<option value="10">Outubro</option>
<option value="11">Novembro</option>
<option value="12">Dezembro</option>
</select>

<table>
<thead>
<tr>
<th>Data</th>
<th>Café Antes</th>
<th>Café Depois</th>
<th>Almoço Antes</th>
<th>Almoço Depois</th>
<th>Jantar Antes</th>
<th>Jantar Depois</th>
<th>Madrugada</th>
</tr>
</thead>
<tbody id="tabelaRelatorio"></tbody>
</table>
</div>

</div>

<script>
/* ================= STORAGE ================= */
const STORAGE_GLICO = "glicogabi_medicoes";
const STORAGE_DOSES = "glicogabi_doses";

/* ================= DOSES ================= */
function salvarDoses(){
    const doses = {
        nph: dose_nph.value,
        regular: dose_regular.value,
        metformina: dose_metformina.value
    };
    localStorage.setItem(STORAGE_DOSES, JSON.stringify(doses));
    alert("Doses salvas com sucesso ✅");
}

function carregarDoses(){
    const doses = JSON.parse(localStorage.getItem(STORAGE_DOSES));
    if(!doses) return;
    dose_nph.value = doses.nph || "";
    dose_regular.value = doses.regular || "";
    dose_metformina.value = doses.metformina || "";
}

/* ================= RELATÓRIO ================= */
const mapa = {
    "Jejum":"cafeAntes",
    "Pós café":"cafeDepois",
    "Antes do almoço":"almocoAntes",
    "Depois do almoço":"almocoDepois",
    "Antes da janta":"jantarAntes",
    "Depois da janta":"jantarDepois",
    "Madrugada":"madrugada"
};

function carregarRelatorio(){
    const mesSelecionado = mes.value;
    const dados = JSON.parse(localStorage.getItem(STORAGE_GLICO)) || [];
    const linhas = {};

    dados.forEach(r=>{
        const [ano,mesData,dia] = r.data.split("-");
        if(mesData !== mesSelecionado) return;

        if(!linhas[r.data]){
            linhas[r.data] = {
                cafeAntes:"",
                cafeDepois:"",
                almocoAntes:"",
                almocoDepois:"",
                jantarAntes:"",
                jantarDepois:"",
                madrugada:""
            };
        }
        linhas[r.data][mapa[r.momento]] = r.valor;
    });

    tabelaRelatorio.innerHTML = "";

    Object.keys(linhas).sort().forEach(data=>{
        const r = linhas[data];
        tabelaRelatorio.innerHTML += `
        <tr>
            <td>${data.split("-").reverse().join("/")}</td>
            <td>${r.cafeAntes}</td>
            <td>${r.cafeDepois}</td>
            <td>${r.almocoAntes}</td>
            <td>${r.almocoDepois}</td>
            <td>${r.jantarAntes}</td>
            <td>${r.jantarDepois}</td>
            <td>${r.madrugada}</td>
        </tr>`;
    });
}

/* ================= INIT ================= */
carregarDoses();
carregarRelatorio();
</script>

</body>
</html>
