<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlicoGabi - Lembretes</title>
    <style>
        :root { --primaria: #7e57ff; --lavanda: #f4f0ff; }
        body { font-family: 'Segoe UI', sans-serif; background: white; margin: 0; padding: 0; }
        .container { width: 100%; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 30px; }
        .header { background: var(--primaria); color: white; text-align: center; padding: 20px; }
        .tabs { display: flex; background: var(--lavanda); margin: 15px; border-radius: 12px; padding: 5px; gap: 5px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; font-weight: bold; color: var(--primaria); cursor: pointer; }
        .tab-btn.active { background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,.1); }
        .section-box { background: var(--lavanda); margin: 0 15px 15px; padding: 20px; border-radius: 20px; display: flex; flex-direction: column; gap: 12px; }
        .dias-semana { display: flex; justify-content: space-between; margin: 10px 0; }
        .dia-circulo { width: 35px; height: 35px; border-radius: 50%; border: 1px solid var(--primaria); display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; font-weight: bold; }
        .dia-circulo.active { background: var(--primaria); color: white; }
        .alarme-card { background: #f9f9f9; border-radius: 15px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>Meus Alertas</h1></div>
    <div class="tabs">
        <button id="btnLembretes" class="tab-btn active" onclick="toggleAba('lembretes')">Alarmes</button>
        <button id="btnConfigLembrete" class="tab-btn" onclick="toggleAba('config-lembrete')">Novo</button>
    </div>
    <div id="abaConfigLembrete" class="hidden">
        <div class="section-box">
            <input type="text" id="titLembrete" placeholder="Descrição">
            <input type="time" id="horaLembrete">
            <div class="dias-semana">
                <div class="dia-circulo" onclick="this.classList.toggle('active')" data-dia="Dom">D</div>
                <div class="dia-circulo" onclick="this.classList.toggle('active')" data-dia="Seg">S</div>
                <div class="dia-circulo" onclick="this.classList.toggle('active')" data-dia="Ter">T</div>
                <div class="dia-circulo" onclick="this.classList.toggle('active')" data-dia="Qua">Q</div>
                <div class="dia-circulo" onclick="this.classList.toggle('active')" data-dia="Qui">Q</div>
                <div class="dia-circulo" onclick="this.classList.toggle('active')" data-dia="Sex">S</div>
                <div class="dia-circulo" onclick="this.classList.toggle('active')" data-dia="Sáb">S</div>
            </div>
            <button style="background:var(--primaria); color:white; border:none; padding:15px; border-radius:12px; font-weight:bold;" onclick="salvarLembrete()">Salvar</button>
        </div>
    </div>
    <div id="abaLembretes" style="padding: 0 15px;"></div>
</div>
<script>
    let lembretes = JSON.parse(localStorage.getItem('gabi_lembretes_v2') || '[]');
    function toggleAba(aba) {
        document.getElementById('abaLembretes').classList.toggle('hidden', aba !== 'lembretes');
        document.getElementById('abaConfigLembrete').classList.toggle('hidden', aba !== 'config-lembrete');
        document.getElementById('btnLembretes').classList.toggle('active', aba === 'lembretes');
        document.getElementById('btnConfigLembrete').classList.toggle('active', aba === 'config-lembrete');
        if(aba === 'lembretes') render();
    }
    function salvarLembrete() {
        const tit = document.getElementById('titLembrete').value;
        const hora = document.getElementById('horaLembrete').value;
        const dias = Array.from(document.querySelectorAll('.dia-circulo.active')).map(d => d.getAttribute('data-dia'));
        if(!tit || !hora || dias.length === 0) return alert("Preencha tudo!");
        lembretes.push({ id: Date.now(), tit, hora, dias });
        localStorage.setItem('gabi_lembretes_v2', JSON.stringify(lembretes));
        toggleAba('lembretes');
    }
    function render() {
        const lista = document.getElementById('abaLembretes');
        lista.innerHTML = lembretes.map(l => `<div class="alarme-card"><div><b style="font-size:24px">${l.hora}</b><br><small>${l.tit}</small><br><small style="color:var(--primaria)">${l.dias.join(' • ')}</small></div><button onclick="excluir(${l.id})">Excluir</button></div>`).join('');
    }
    function excluir(id) { lembretes = lembretes.filter(l => l.id !== id); localStorage.setItem('gabi_lembretes_v2', JSON.stringify(lembretes)); render(); }
    render();
</script>
</body>
</html>
