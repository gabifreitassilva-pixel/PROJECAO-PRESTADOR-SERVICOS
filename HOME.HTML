<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlicoGabi</title>
    <style>
        :root { --primaria: #7e57ff; --laranja: #ff9800; --verde: #4caf50; --vermelho: #f44336; }
        body { font-family: 'Segoe UI', sans-serif; background-color: white; margin: 0; padding: 0; display: block; }
        .container { width: 100%; background: white; min-height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; padding-bottom: 30px; }
        .header { background-color: var(--primaria); color: white; padding: 30px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .header h1 { margin: 0; font-size: 32px; font-weight: bold; }
        .header p { margin: 10px 0 0; font-size: 16px; opacity: 0.9; }
        .doses-container { display: flex; justify-content: center; gap: 10px; padding: 10px 15px; }
        .dose-box { border: 1px solid #eee; border-radius: 10px; padding: 5px; text-align: center; flex: 1; font-size: 11px; }
        .input-area { background-color: #f4f0ff; margin: 0 15px 15px; padding: 15px; border-radius: 20px; display: flex; flex-direction: column; gap: 8px; }
        select, input { padding: 10px; border-radius: 10px; border: 1px solid #ddd; font-size: 14px; }
        button { background-color: var(--primaria); color: white; border: none; padding: 12px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        /* Estilo do Botão Excluir */
        .btn-excluir { float: right; background: none; border: none; color: #ff5252; font-weight: bold; cursor: pointer; font-size: 10px; text-transform: uppercase; }

        .group-card { background: white; border-radius: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 12px; border-left: 5px solid var(--primaria); overflow: hidden; padding-bottom: 5px; }
        .group-header { padding: 8px 15px; font-weight: bold; background: #fafafa; font-size: 16px; color: #333; }
        .main-entry { padding: 10px 15px; position: relative; }
        .main-val { font-size: 24px; font-weight: bold; color: var(--laranja); }
        .main-feedback { font-size: 13px; margin-top: 3px; font-weight: bold; }
        .sub-entry { padding: 5px 15px; border-top: 1px dashed #eee; margin-top: 5px; }
        .sub-time-row { font-size: 11px; color: #666; display: flex; align-items: center; gap: 5px; }
        .hipo { color: var(--vermelho); }
        .excelente { color: var(--verde); }
        .alerta { color: var(--laranja); }
        .hiper { color: var(--vermelho); }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>GlicoGabi</h1>
        <p>Olá, Gabriela! Vamos cuidar da saúde?</p>
    </div>

    <div id="doses-dinamicas" class="doses-container"></div>

    <div class="input-area">
        <select id="momento">
            <option value="Jejum">🌅 Jejum</option>
            <option value="Pós café">☕ Pós café</option>
            <option value="Antes do almoço">🥗 Antes do almoço</option>
            <option value="Depois do almoço">🍛 Depois do almoço</option>
            <option value="Antes da janta">🍽️ Antes da janta</option>
            <option value="Depois da janta">🍕 Depois da janta</option>
            <option value="Madrugada">🌙 Madrugada</option>
        </select>
        <input type="number" id="glicemia" placeholder="mg/dL" inputmode="numeric">
        <button onclick="salvar()">Salvar Registro</button>
    </div>
    <div id="historico" class="history-list"></div>
</div>

<script>
    const ultimaGlicemiaPorPeriodo = {};

    function carregarAjustes() {
        // Puxa os dados salvos na aba Ajustes
        const ajustes = JSON.parse(localStorage.getItem('ajustesGlicoGabi')) || {
            meta: 130, sensibilidade: 72, nph: "10un", regular: "15un", metformina: "850mg"
        };
        document.getElementById('doses-dinamicas').innerHTML = `
            <div class="dose-box">NPH <b>${ajustes.nph}</b></div>
            <div class="dose-box">Regular <b>${ajustes.regular}</b></div>
            <div class="dose-box">Metf. <b>${ajustes.metformina}</b></div>
        `;
        return ajustes;
    }

    function salvar() {
        const valor = parseInt(document.getElementById('glicemia').value);
        const momento = document.getElementById('momento').value;
        if (!valor) return;

        const ajustes = carregarAjustes();
        const agora = new Date();
        const horaFinal = agora.getHours().toString().padStart(2, '0') + ":" + agora.getMinutes().toString().padStart(2, '0');

        let feedback = ""; let classe = "";
        const primeiraMedida = !ultimaGlicemiaPorPeriodo[momento];
        const subiu = !primeiraMedida && valor > ultimaGlicemiaPorPeriodo[momento];

        if (valor < 70) { feedback = "Hipoglicemia! Consumir carboidrato rápido."; classe = "hipo"; }
        else if (valor <= ajustes.meta) { feedback = "Valor excelente! Continue cuidando."; classe = "excelente"; }
        else if (valor <= 180) { feedback = "Valor um pouco alto. Hidrate-se."; classe = "alerta"; }
        else {
            let correcao = Math.ceil((valor - ajustes.meta) / ajustes.sensibilidade);
            feedback = (primeiraMedida || subiu) ? `Valor elevado. Sugestão: +${correcao}un Regular.` : "Aguarde a dose anterior e hidrate.";
            classe = "hiper";
        }

        let cardId = `card-${momento.replace(/\s+/g, '')}`;
        let card = document.getElementById(cardId);

        if (!card) {
            card = document.createElement('div');
            card.id = cardId; card.className = 'group-card';
            card.innerHTML = `
                <div class="group-header">${momento}</div>
                <div class="content">
                    <div class="main-entry">
                        <button class="btn-excluir" onclick="this.parentElement.parentElement.parentElement.remove()">Excluir</button>
                        <div style="font-size:10px; color:#999;">${agora.toLocaleDateString('pt-BR')} - ${horaFinal}</div>
                        <div class="main-val">${valor} <span style="font-size:12px; font-weight:normal;">mg/dL</span></div>
                        <div class="main-feedback ${classe}">${feedback}</div>
                    </div>
                    <div class="sub-list"></div>
                </div>`;
            document.getElementById('historico').appendChild(card);
        } else {
            const subList = card.querySelector('.sub-list');
            const subItem = document.createElement('div');
            subItem.className = 'sub-entry';
            subItem.innerHTML = `
                <button class="btn-excluir" onclick="this.parentElement.remove()">Excluir</button>
                <div class="sub-time-row"><span>└ ${horaFinal} -</span><b>${valor} mg/dL</b></div>
                <span class="sub-feedback ${classe}">${feedback}</span>`;
            subList.appendChild(subItem);
        }
        ultimaGlicemiaPorPeriodo[momento] = valor;
        document.getElementById('glicemia').value = "";
    }
    window.onload = carregarAjustes;
</script>
</body>
</html>
