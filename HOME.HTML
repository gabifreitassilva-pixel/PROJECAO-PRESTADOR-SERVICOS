<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlicoGabi - Home</title>
    <style>
        :root { --primaria: #7e57ff; --lavanda: #f4f0ff; --perigo: #ff4444; --sucesso: #4caf50; }
        body { font-family: 'Segoe UI', sans-serif; background: #fdfbff; margin: 0; padding: 15px; }
        .card-input { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        select, input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; box-sizing: border-box; }
        .btn-salvar { background: var(--primaria); color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; font-size: 16px; }
        
        /* Estilo dos Cards de Histórico conforme a imagem fornecida */
        .historico-container { display: flex; flex-direction: column; gap: 10px; }
        .card-log { background: white; border-radius: 15px; padding: 15px; border-left: 6px solid var(--perigo); position: relative; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card-log.bom { border-left-color: var(--sucesso); }
        .log-header { font-weight: bold; font-size: 16px; display: flex; justify-content: space-between; }
        .log-time { font-size: 11px; color: #888; margin: 5px 0; }
        .log-value { font-size: 24px; font-weight: bold; color: #ff9800; }
        .log-value span { font-size: 12px; font-weight: normal; }
        .log-msg { font-size: 12px; color: var(--perigo); font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="card-input">
        <select id="momento">
            <option value="Jejum">🌅 Jejum</option>
            <option value="Pós café da manhã">☕ Pós café da manhã</option>
            <option value="Antes do almoço">🥗 Antes do almoço</option>
            <option value="Depois do almoço">🥘 Depois do almoço</option>
            <option value="Antes da janta">🍽️ Antes da janta</option>
            <option value="Depois da janta">🍕 Depois da janta</option>
            <option value="Madrugada">🌙 Madrugada</option>
        </select>
        <input type="number" id="valor" placeholder="mg/dL">
        <input type="date" id="data">
        <input type="time" id="hora">
        <button class="btn-salvar" onclick="salvar()">Salvar Registro</button>
    </div>

    <div id="listaHistorico" class="historico-container"></div>

    <script>
        // Inicializa data e hora atual
        const agora = new Date();
        document.getElementById('data').valueAsDate = agora;
        document.getElementById('hora').value = agora.getHours().toString().padStart(2, '0') + ":" + agora.getMinutes().toString().padStart(2, '0');

        function salvar() {
            const momento = document.getElementById('momento').value;
            const valor = document.getElementById('valor').value;
            const data = document.getElementById('data').value;
            const hora = document.getElementById('hora').value;

            if(!valor || !data) return alert("Preencha os campos!");

            const dataBr = data.split('-').reverse().join('/');
            const db = JSON.parse(localStorage.getItem('gabi_database') || '[]');
            
            db.unshift({ data: dataBr, hora, momento, valor: parseInt(valor) });
            localStorage.setItem('gabi_database', JSON.stringify(db));
            
            document.getElementById('valor').value = "";
            render();
        }

        function render() {
            const db = JSON.parse(localStorage.getItem('gabi_database') || '[]');
            const lista = document.getElementById('listaHistorico');
            
            lista.innerHTML = db.map(i => {
                const isAlto = i.valor > 180;
                return `
                <div class="card-log ${isAlto ? '' : 'bom'}">
                    <div class="log-header">${i.momento}</div>
                    <div class="log-time">${i.data} - ${i.hora}</div>
                    <div class="log-value">${i.valor} <span>mg/dL</span></div>
                    <div class="log-msg">${isAlto ? 'Valor elevado. Sugestão: +2un Regular e água.' : 'Valor excelente! Continue cuidando de você.'}</div>
                </div>`;
            }).join('');
        }
        render();
    </script>
</body>
</html>
