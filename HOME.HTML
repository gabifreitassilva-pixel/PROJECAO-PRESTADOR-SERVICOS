<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlicoGabi</title>

<style>
body{margin:0;font-family:Segoe UI;background:#f2f2f2}
.container{max-width:420px;margin:auto;background:#fff;min-height:100vh;padding:15px}
select,input,button{
    width:100%;
    padding:10px;
    margin-top:8px;
    border-radius:8px;
    border:1px solid #ccc
}
button{background:#7e57ff;color:#fff;font-weight:bold;border:none}
.card{
    margin-top:12px;
    padding:10px;
    border-left:5px solid #7e57ff;
    background:#fafafa;
    border-radius:8px
}
</style>
</head>

<body>
<div class="container">

<h2>GlicoGabi</h2>

<select id="momento">
<option>Jejum</option>
<option>Pós café</option>
<option>Antes do almoço</option>
<option>Depois do almoço</option>
<option>Antes da janta</option>
<option>Depois da janta</option>
<option>Madrugada</option>
</select>

<input type="number" id="glicemia" placeholder="Glicemia mg/dL">
<input type="date" id="data">
<input type="time" id="hora">

<button onclick="salvar()">Salvar Registro</button>

<div id="historico"></div>

</div>

<script>
const STORAGE = "glicogabi_medicoes";

function dataSelecionada(){
    return data.value || new Date().toISOString().split("T")[0];
}

function salvar(){
    const valor = parseInt(glicemia.value);
    if(!valor) return;

    const registro = {
        valor,
        momento: momento.value,
        data: dataSelecionada(),
        hora: hora.value || new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})
    };

    const dados = JSON.parse(localStorage.getItem(STORAGE)) || [];
    dados.push(registro);
    localStorage.setItem(STORAGE, JSON.stringify(dados));

    renderizar();
    glicemia.value="";
}

function renderizar(){
    const dia = dataSelecionada();
    const dados = JSON.parse(localStorage.getItem(STORAGE)) || [];
    historico.innerHTML="";

    dados.filter(r => r.data === dia)
         .forEach(r=>{
            historico.innerHTML += `
            <div class="card">
                <b>${r.momento}</b><br>
                ${r.valor} mg/dL<br>
                ${r.hora}
            </div>`;
         });
}

data.addEventListener("change", renderizar);
renderizar();
</script>

</body>
</html>
