<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlicoGabi - Home</title>
    <style>
        :root { --primaria: #7e57ff; --laranja: #ff9800; --verde: #4caf50; --vermelho: #f44336; --lavanda: #f4f0ff; }
        body { font-family: 'Segoe UI', sans-serif; background: white; margin: 0; padding: 0; }
        .container { width: 100%; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 30px; }
        .header { background: var(--primaria); color: white; padding: 25px; text-align: center; }
        .doses-topo { display: flex; justify-content: center; gap: 10px; padding: 10px; background: var(--lavanda); flex-wrap: wrap; }
        .dose-card-topo { background: white; border: 1px solid #ddd; border-radius: 10px; padding: 8px; text-align: center; flex: 1; min-width: 80px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .dose-card-topo span { font-size: 10px; color: #666; display: block; text-transform: uppercase; }
        .dose-card-topo b { color: var(--primaria); font-size: 16px; }
        .input-area { background: var(--lavanda); margin: 15px; padding: 20px; border-radius: 20px; display: flex; flex-direction: column; gap: 12px; }
        label { font-size: 11px; font-weight: bold; color: var(--primaria); text-transform: uppercase; }
        input, select { padding: 12px; border-radius: 12px; border: 1px solid #ddd; font-size: 15px; }
        .btn-registrar { background: var(--laranja); color: white; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .history-section { padding: 0 15px; }
        .group-card { background: white; border-radius: 18px; padding: 15px; margin-bottom: 15px; border-left: 6px solid var(--primaria); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .group-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 10px; }
        .momento-txt { font-weight: bold; color: var(--primaria); font-size: 14px; }
        .data-hora-txt { font-size: 11px; color: #777; }
        .main-val { font-size: 26px; font-weight: bold; color: #333; }
        .feedback-txt { font-size: 13px; font-weight: bold; margin-top: 5px; }
        .excelente { color: var(--verde); } .alerta { color: var(--laranja); } .perigo { color: var(--vermelho); }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>GlicoGabi</h1></div>
    <div id="dosesAjustesHome" class="doses-topo"></div>

    <div class="input-area">
        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;"><label>Data</label><input type="date" id="data-retro" onchange="renderizarHome()"></div>
            <div style="flex: 1;"><label>Hora</label><input type="time" id="hora-retro"></div>
        </div>
        <label>Momento</label>
        <select id="momento">
            <option value="Jejum">🌅 Jejum</option>
            <option value="Pós café">☕ Pós café</option>
            <option value="Antes do almoço">🥗 Antes do almoço</option>
            <option value="Depois do almoço">🍛 Depois do almoço</option>
            <option value="Antes da janta">🍽️ Antes da janta</option>
            <option value="Depois da janta">🍕 Depois da janta</option>
            <option value="Antes de Dormir">🌙 Antes de Dormir</option>
        </select>
        <label>Glicemia (mg/dL)</label>
        <input type="number" id="glicemia" placeholder="Ex: 110" inputmode="numeric">
        <button class="btn-registrar" onclick="registrar()">Registrar Glicemia</button>
    </div>
    <div class="history-section" id="historico"></div>
</div>

<script>
    const ALVO = 130; const FSI = 72;

    function carregarDoses() {
        const dados = localStorage.getItem('gabi_ajustes_vFinal');
        if (dados) {
            const doses = JSON.parse(dados);
            document.getElementById('dosesAjustesHome').innerHTML = doses.map(d => `<div class="dose-card-topo"><span>${d.nome}</span><b>${d.qtd}</b></div>`).join('');
        }
    }

    function registrar() {
        const valor = parseInt(document.getElementById('glicemia').value);
        const momento = document.getElementById('momento').value;
        const dataInput = document.getElementById('data-retro').value;
        const horaInput = document.getElementById('hora-retro').value;

        if (!valor) return alert("Insira o valor!");

        const agora = new Date();
        const dataFinal = dataInput || agora.toISOString().split('T')[0];
        const horaFinal = horaInput || agora.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});

        let historico = JSON.parse(localStorage.getItem('gabi_historico_glicemias') || '[]');
        historico.push({ data: dataFinal, hora: horaFinal, valor: valor, momento: momento });
        localStorage.setItem('gabi_historico_glicemias', JSON.stringify(historico));

        document.getElementById('glicemia').value = "";
        renderizarHome();
    }

    function renderizarHome() {
        const historicoDiv = document.getElementById('historico');
        const dataFiltro = document.getElementById('data-retro').value || new Date().toISOString().split('T')[0];
        const historico = JSON.parse(localStorage.getItem('gabi_historico_glicemias') || '[]');
        const registrosDoDia = historico.filter(reg => reg.data === dataFiltro);
        
        historicoDiv.innerHTML = "";

        registrosDoDia.slice().reverse().forEach(reg => {
            let feedback = ""; let classe = "";
            if (reg.valor < 70) { feedback = "Hipoglicemia! Consumir 15g de carboidrato."; classe = "perigo"; }
            else if (reg.valor <= 130) { feedback = "Valor excelente!"; classe = "excelente"; }
            else if (reg.valor <= 180) { feedback = "Um pouco alto. Beba água."; classe = "alerta"; }
            else { 
                let unidades = Math.ceil((reg.valor - ALVO) / FSI);
                feedback = `Elevada. Sugestão: +${unidades} UI Insulina Regular.`; 
                classe = "perigo"; 
            }

            const card = document.createElement('div');
            card.className = 'group-card';
            card.innerHTML = `
                <div class="group-header">
                    <span class="momento-txt">${reg.momento}</span>
                    <span class="data-hora-txt">${reg.data.split('-').reverse().join('/')} às ${reg.hora}</span>
                </div>
                <div class="main-val">${reg.valor} mg/dL</div>
                <div class="feedback-txt ${classe}">${feedback}</div>
            `;
            historicoDiv.appendChild(card);
        });
    }

    window.onload = () => { carregarDoses(); renderizarHome(); };
</script>
</body>
</html>
