<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlicoGabi - HOME</title>
<style>
body{margin:0;font-family:Segoe UI;background:#f2f2f2}
.container{max-width:420px;margin:auto;background:#fff;min-height:100vh;padding:15px}
h2{text-align:center}
input,select,button{
    width:100%;
    padding:10px;
    margin-top:8px;
    border-radius:8px;
    border:1px solid #ccc
}
button{background:#7e57ff;color:#fff;font-weight:bold;border:none}
</style>
</head>
<body>

<div class="container">
<h2>GlicoGabi</h2>

<select id="momento">
<option>Jejum</option>
<option>Pós café</option>
<option>Antes do almoço</option>
<option>Depois do almoço</option>
<option>Antes da janta</option>
<option>Depois da janta</option>
<option>Madrugada</option>
</select>

<input type="number" id="glicemia" placeholder="Glicemia mg/dL">
<input type="date" id="data">
<input type="time" id="hora">

<button onclick="salvar()">Salvar</button>
</div>

<script>
const STORAGE_GLICO = "glicogabi_medicoes";
const STORAGE_DOSES = "glicogabi_doses";

function salvar(){
    const valor = parseInt(glicemia.value);
    if(!valor) return;

    const registro = {
        valor,
        momento: momento.value,
        data: data.value || new Date().toISOString().split("T")[0],
        hora: hora.value || new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})
    };

    const dados = JSON.parse(localStorage.getItem(STORAGE_GLICO)) || [];
    dados.push(registro);
    localStorage.setItem(STORAGE_GLICO, JSON.stringify(dados));

    alert("Glicemia salva e enviada ao relatório ✅");
    glicemia.value="";
}
</script>

</body>
</html>
