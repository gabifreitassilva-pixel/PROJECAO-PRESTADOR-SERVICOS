<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Registro</title>
    <style>
        :root { --primaria: #7e57ff; --lavanda: #f4f0ff; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; background: #fff; }
        .card { background: var(--lavanda); padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #e3d9ff; }
        label { font-size: 11px; font-weight: bold; color: var(--primaria); text-transform: uppercase; display: block; margin: 10px 0 5px; }
        input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ccc; box-sizing: border-box; }
        .btn { background: var(--primaria); color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: bold; margin-top: 15px; }
        .item { background: white; padding: 10px; border-radius: 8px; margin-top: 5px; border-left: 4px solid var(--primaria); display: flex; justify-content: space-between; }
        h2 { color: var(--primaria); margin-top: 0; font-size: 18px; }
    </style>
</head>
<body>
    <h2>Registrar Glicemia</h2>
    <div class="card">
        <label>Data</label>
        <input type="date" id="dataReg" onchange="listarRegistrosDia()">
        
        <label>Momento da Medição</label>
        <select id="momentoReg">
            <option>Jejum</option>
            <option>Pós café</option>
            <option>Antes do almoço</option>
            <option>Depois do almoço</option>
            <option>Antes da janta</option>
            <option>Depois da janta</option>
            <option>Madrugada</option>
        </select>

        <label>Valor (mg/dL)</label>
        <input type="number" id="valorGlicose" placeholder="000">
        
        <button class="btn" onclick="salvar()">Salvar Medição</button>
    </div>

    <div class="card" id="cardDoses">
        <label>Minhas Doses (Cadastradas em Ajustes)</label>
        <div id="listaDoses"></div>
    </div>

    <label>Registros de Hoje</label>
    <div id="listaDia"></div>

    <script>
        document.getElementById('dataReg').valueAsDate = new Date();

        function salvar() {
            const data = document.getElementById('dataReg').value;
            const momento = document.getElementById('momentoReg').value;
            const valor = document.getElementById('valorGlicose').value;
            if(!valor) return alert("Digite o valor!");

            const dataBr = data.split('-').reverse().join('/');
            const db = JSON.parse(localStorage.getItem('gabi_glicemias') || '[]');
            
            db.push({ data: dataBr, dataISO: data, momento, valor });
            localStorage.setItem('gabi_glicemias', JSON.stringify(db));
            
            document.getElementById('valorGlicose').value = "";
            alert("Salvo!");
            listarRegistrosDia();
        }

        function listarRegistrosDia() {
            const dataSel = document.getElementById('dataReg').value.split('-').reverse().join('/');
            const db = JSON.parse(localStorage.getItem('gabi_glicemias') || '[]');
            const list = db.filter(i => i.data === dataSel);
            
            document.getElementById('listaDia').innerHTML = list.map(i => `
                <div class="item"><span>${i.momento}</span><b>${i.valor} mg/dL</b></div>
            `).join('') || '<small>Nenhum registro.</small>';

            // Carrega Doses da Aba Ajustes
            const doses = JSON.parse(localStorage.getItem('gabi_ajustes_vFinal') || '[]');
            document.getElementById('listaDoses').innerHTML = doses.map(d => `
                <div class="item"><span>💉 ${d.nome}</span><b>${d.qtd}</b></div>
            `).join('') || '<small>Vá em Ajustes para cadastrar suas doses.</small>';
        }

        listarRegistrosDia();
    </script>
</body>
</html>
