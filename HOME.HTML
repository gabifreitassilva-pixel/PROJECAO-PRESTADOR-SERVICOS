<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GlicoGabi</title>
    <link rel="manifest" href="MANIFEST.JSON">
    <meta name="theme-color" content="#7e57ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        :root { --primaria: #7e57ff; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background-color: white; display: flex; flex-direction: column; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #janela { flex: 1; border: none; width: 100%; }
        .nav-tabs { display: flex; background: white; border-top: 1px solid #eee; padding-bottom: env(safe-area-inset-bottom); height: 70px; justify-content: space-around; align-items: center; }
        .tab-btn { background: none; border: none; color: #888; display: flex; flex-direction: column; align-items: center; font-size: 10px; cursor: pointer; transition: 0.3s; }
        .tab-btn i { font-style: normal; font-size: 20px; margin-bottom: 4px; }
        .tab-btn.active { color: var(--primaria); font-weight: bold; }
        #splash { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--primaria); display: flex; justify-content: center; align-items: center; z-index: 999; transition: 0.8s ease-in-out; }
        #splash h1 { color: white; font-size: 32px; }
    </style>
</head>
<body>
    <div id="splash"><h1>GlicoGabi</h1></div>
    
    <iframe id="janela" src="HOME.HTML"></iframe>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="navegar('HOME.HTML', this)"><i>🏠</i><span>Home</span></button>
        <button class="tab-btn" onclick="navegar('CONSULTAS E EXAMES.html', this)"><i>🩺</i><span>Consultas</span></button>
        <button class="tab-btn" onclick="navegar('HISTÓRICO.html', this)"><i>📅</i><span>Histórico</span></button>
        <button class="tab-btn" onclick="navegar('ESTOQUES.html', this)"><i>📦</i><span>Estoque</span></button>
        <button class="tab-btn" onclick="navegar('AJUSTE.html', this) "><i>⚙️</i><span>Ajustes</span></button>
        <button class="tab-btn" onclick="navegar('LEMBRETES.HTML', this)"><i>🔔</i><span>Alertas</span></button>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => { document.getElementById('splash').style.transform = 'translateY(-100%)'; }, 2000);
        });
        function navegar(url, btn) {
            document.getElementById('janela').src = url;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>
