<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlicoGabi - Lançamentos</title>
    <style>
        :root { --primaria: #7e57ff; --lavanda: #f4f0ff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #fdfbff; margin: 0; padding: 20px; color: #333; padding-bottom: 80px; }
        h2 { color: var(--primaria); text-align: center; }
        .card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; border-left: 5px solid var(--primaria); position: relative; }
        .btn-excluir { position: absolute; top: 10px; right: 10px; background: #ff4d4d; color: white; border: none; padding: 5px 8px; border-radius: 5px; cursor: pointer; font-size: 10px; font-weight: bold; }
        label { display: block; margin-top: 10px; font-weight: bold; color: var(--primaria); }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .btn-salvar { background: var(--primaria); color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; margin-top: 20px; font-weight: bold; cursor: pointer; }
        .resultado { background: var(--lavanda); padding: 15px; border-radius: 10px; margin-top: 15px; text-align: center; font-weight: bold; color: var(--primaria); border: 1px solid var(--primaria); }
        .historico-lista { margin-top: 20px; }
    </style>
</head>
<body>

    <h2>📊 Lançamentos</h2>

    <div class="card">
        <label>Glicemia (mg/dL):</label>
        <input type="number" id="glicemia" placeholder="Ex: 120">

        <label>Refeição:</label>
        <select id="refeicao">
            <option value="Jejum">Jejum</option>
            <option value="Pré-Prandial">Pré-Prandial</option>
            <option value="Pós-Prandial">Pós-Prandial</option>
            <option value="Antes de Dormir">Antes de Dormir</option>
        </select>

        <label>Carboidratos (g):</label>
        <input type="number" id="carbos" placeholder="Ex: 45">

        <button class="btn-salvar" onclick="calcularESalvar()">Calcular e Salvar</button>
    </div>

    <div id="resultadoInsulina" class="resultado" style="display:none;"></div>

    <div class="historico-lista" id="listaMedicoes"></div>

    <script>
        // Lógica de cálculos mantida sem alterações
        function calcularESalvar() {
            const glicemia = document.getElementById('glicemia').value;
            const carbos = document.getElementById('carbos').value;
            const refeicao = document.getElementById('refeicao').value;

            if (!glicemia) { alert("Por favor, insira a glicemia."); return; }

            // Parâmetros de exemplo (Ajuste conforme seus valores reais se necessário)
            const meta = 100;
            const fatorSensibilidade = 50;
            const relacaoCarbo = 15;

            let doseCorrecao = Math.max(0, (glicemia - meta) / fatorSensibilidade);
            let doseCarbo = carbos / relacaoCarbo;
            let doseTotal = Math.round(doseCorrecao + doseCarbo);

            const agora = new Date();
            const novaMedicao = {
                glicemia, carbos, doseTotal, refeicao,
                data: agora.toLocaleDateString('pt-BR'),
                hora: agora.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})
            };

            let medicoes = JSON.parse(localStorage.getItem('medicoes')) || [];
            medicoes.unshift(novaMedicao);
            localStorage.setItem('medicoes', JSON.stringify(medicoes));

            // Atualiza estoque
            let estoque = JSON.parse(localStorage.getItem('estoqueInsulina')) || 0;
            localStorage.setItem('estoqueInsulina', Math.max(0, estoque - doseTotal));

            document.getElementById('resultadoInsulina').style.display = 'block';
            document.getElementById('resultadoInsulina').innerText = `Aplicar: ${doseTotal} unidades de Insulina`;
            
            exibirMedicoes();
            limparCampos();
        }

        function exibirMedicoes() {
            const lista = document.getElementById('listaMedicoes');
            const medicoes = JSON.parse(localStorage.getItem('medicoes')) || [];
            lista.innerHTML = '<h3>Últimos Registros</h3>';

            medicoes.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <button class="btn-excluir" onclick="excluirRegistro(${index})">EXCLUIR</button>
                    <p><strong>Glicemia:</strong> ${item.glicemia} mg/dL (${item.refeicao})</p>
                    <p><strong>Insulina:</strong> ${item.doseTotal} u</p>
                    <small>${item.data} às ${item.hora}</small>
                `;
                lista.appendChild(div);
            });
        }

        // Nova função de exclusão
        function excluirRegistro(index) {
            if (confirm("Deseja apagar este registro?")) {
                let medicoes = JSON.parse(localStorage.getItem('medicoes')) || [];
                medicoes.splice(index, 1);
                localStorage.setItem('medicoes', JSON.stringify(medicoes));
                exibirMedicoes();
            }
        }

        function limparCampos() {
            document.getElementById('glicemia').value = '';
            document.getElementById('carbos').value = '';
        }

        window.onload = exibirMedicoes;
    </script>
</body>
</html>
